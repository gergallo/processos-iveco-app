<body>
<div class="app-bar" id="app-bar" hidden><span id="app-txt">Instale o controle no celular para abrir como aplicativo.</span><button type="button" id="app-inst">Instalar app</button><button type="button" class="gh" id="app-x">Agora não</button></div>

<script>
/* ===== Modo aplicativo: substitui os recursos do Claude por equivalentes próprios =====
   Com config.js preenchido (Supabase): base ÚNICA na nuvem, login por e-mail e senha,
   atualização em tempo real para todos e cópia local para abrir sem internet.
   Sem config.js: base apenas neste aparelho (IndexedDB).                              */
(function(){
  const CFG=window.CONFIG_NUVEM||{}, NUVEM=!!(CFG.url&&CFG.chave&&window.supabase&&!/COLE_AQUI/.test(CFG.url+CFG.chave));
  const DBN="controle-iveco", ST="docs";
  let idb=null, mem=new Map(), pronto=null, sb=null, eu=null, editor=!NUVEM, pend=[];
  const colL=new Map(), docL=new Map();
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const abrir=()=>new Promise((ok,er)=>{ const r=indexedDB.open(DBN,1); r.onupgradeneeded=()=>r.result.createObjectStore(ST); r.onsuccess=()=>ok(r.result); r.onerror=()=>er(r.error); });
  const idbTodos=async()=>{ try{ idb=idb||await abrir(); await new Promise((ok,er)=>{ const c=idb.transaction(ST,"readonly").objectStore(ST).openCursor(); c.onsuccess=()=>{ const cu=c.result; if(cu){ mem.set(cu.key,cu.value); cu.continue(); } else ok(); }; c.onerror=()=>er(c.error); }); }catch(e){ idb=null; } };
  const idbPut=(k,v)=>{ if(!idb) return Promise.resolve(); return new Promise(ok=>{ const tx=idb.transaction(ST,"readwrite"), s=tx.objectStore(ST); v===undefined?s.delete(k):s.put(v,k); tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); }); };
  const idbLimpa=()=>{ if(!idb) return Promise.resolve(); return new Promise(ok=>{ const tx=idb.transaction(ST,"readwrite"); tx.objectStore(ST).clear(); tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); }); };
  const snapCol=col=>({docs:[...mem.entries()].filter(([k])=>k.startsWith(col+"/")&&k.indexOf("/",col.length+1)<0).map(([k,v])=>({id:k.slice(col.length+1),data:()=>clone(v),exists:true}))});
  const snapDoc=p=>{ const v=mem.get(p); return {id:p.split("/").pop(),exists:v!==undefined,data:()=>clone(v)}; };
  const avisaCol=col=>(colL.get(col)||[]).forEach(f=>{ try{f(snapCol(col))}catch(e){console.error(e)} });
  const avisa=path=>{ avisaCol(path.slice(0,path.lastIndexOf("/"))); (docL.get(path)||[]).forEach(f=>{ try{f(snapDoc(path))}catch(e){console.error(e)} }); };
  const avisaTudo=()=>{ colL.forEach((_,c)=>avisaCol(c)); docL.forEach((fs,p)=>fs.forEach(f=>{ try{f(snapDoc(p))}catch(e){} })); };
  const addL=(m,k,f)=>{ if(!m.has(k)) m.set(k,[]); m.get(k).push(f); return ()=>{ const a=m.get(k)||[]; const i=a.indexOf(f); if(i>=0) a.splice(i,1); }; };
  let avisoT=null; const aviso=t=>{ let e=document.getElementById("nv-toast"); if(!e){ e=document.createElement("div"); e.id="nv-toast"; e.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10001;background:#13202A;color:#fff;padding:10px 16px;border-radius:10px;font:14px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw"; document.body.appendChild(e); } e.textContent=t; e.hidden=false; clearTimeout(avisoT); avisoT=setTimeout(()=>e.hidden=true,3500); };
  const status=t=>{ const run=()=>{ const c=document.getElementById("conn-txt"); if(c) c.textContent=t; }; document.readyState==="loading"?document.addEventListener("DOMContentLoaded",run):run(); };

  /* ---------- nuvem ---------- */
  const PK="controle-iveco-pendentes";
  try{ pend=JSON.parse(localStorage.getItem(PK)||"[]"); }catch(e){ pend=[]; }
  const salvaPend=()=>{ try{ localStorage.setItem(PK,JSON.stringify(pend)); }catch(e){} };
  const envia=async op=>{ if(op.del){ const {error}=await sb.from("docs").delete().eq("path",op.path); if(error) throw error; }
    else { const {error}=await sb.from("docs").upsert({path:op.path,data:op.data,updated_at:new Date().toISOString(),updated_by:eu&&eu.email}); if(error) throw error; } };
  let enviando=false;
  const esvazia=async()=>{ if(!NUVEM||enviando||!pend.length||!navigator.onLine) return; enviando=true;
    try{ while(pend.length){ await envia(pend[0]); pend.shift(); salvaPend(); } status("Nuvem · sincronizado"); }catch(e){ status(`Sem conexão · ${pend.length} alteração(ões) aguardando envio`); } enviando=false; };
  const telaLogin=()=>new Promise(res=>{ const monta=()=>{ const ov=document.createElement("div"); ov.id="nv-login"; ov.innerHTML=`<form class="nv-box" autocomplete="on"><img src="icon-192.png" alt="" width="56" height="56"><h2>Controle Processos Iveco</h2><p>Entre com o e-mail e a senha que você recebeu.</p><label>E-mail<input type="email" name="email" autocomplete="username" required></label><label>Senha<input type="password" name="senha" autocomplete="current-password" required></label><button type="submit">Entrar</button><div class="nv-msg" role="status"></div></form>`;
      document.body.appendChild(ov); const f=ov.querySelector("form"), m=ov.querySelector(".nv-msg"); f.email.focus();
      f.onsubmit=async e=>{ e.preventDefault(); m.textContent="Entrando…"; const {data,error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.senha.value});
        if(error){ m.textContent=/Invalid login/i.test(error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar: "+error.message; return; } ov.remove(); res(data.session); }; };
    document.readyState==="loading"?document.addEventListener("DOMContentLoaded",monta):monta(); });
  const baixaTudo=async()=>{ const novo=new Map(); for(let i=0;;i+=1000){ const {data,error}=await sb.from("docs").select("path,data").range(i,i+999); if(error) throw error; data.forEach(r=>novo.set(r.path,r.data)); if(data.length<1000) break; }
    pend.forEach(op=>op.del?novo.delete(op.path):novo.set(op.path,op.data)); mem=novo; await idbLimpa(); for(const [k,v] of mem) await idbPut(k,v); };
  const iniciaNuvem=async()=>{
    sb=window.supabase.createClient(CFG.url,CFG.chave,{auth:{persistSession:true,autoRefreshToken:true}});
    await idbTodos(); // mostra a última cópia enquanto conecta
    let {data:{session}}=await sb.auth.getSession();
    if(!session&&navigator.onLine) session=await telaLogin();
    eu=session&&session.user;
    if(!eu){ status("Sem internet · mostrando a última cópia salva"); editor=false; return; }
    try{ const {data}=await sb.from("editores").select("email").eq("email",eu.email).maybeSingle(); editor=!!data; }catch(e){ editor=false; }
    try{ await baixaTudo(); status(editor?"Nuvem · sincronizado":"Nuvem · somente leitura"); }catch(e){ status("Sem conexão · mostrando a última cópia salva"); }
    sb.channel("docs-rt").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      if(p.eventType==="DELETE"){ const k=p.old&&p.old.path; if(!k) return; mem.delete(k); idbPut(k,undefined); avisa(k); }
      else { const r=p.new; if(!r||!r.path) return; mem.set(r.path,r.data); idbPut(r.path,r.data); avisa(r.path); } }).subscribe();
    addEventListener("online",()=>{ esvazia(); baixaTudo().then(avisaTudo).catch(()=>{}); });
    addEventListener("offline",()=>status("Sem internet · usando a cópia salva"));
    setInterval(esvazia,30000); esvazia();
    const marca=()=>{ document.body.classList.toggle("nv-leitura",!editor); const bar=document.createElement("div"); bar.className="nv-user"; bar.innerHTML=`<span>👤 ${eu.email}${editor?"":" · <b>somente leitura</b>"}</span><button type="button">Sair</button>`;
      bar.querySelector("button").onclick=async()=>{ await sb.auth.signOut(); await idbLimpa(); try{ localStorage.removeItem(PK); }catch(e){} location.reload(); };
      const c=document.querySelector(".conn"); (c&&c.parentNode||document.body).appendChild(bar); };
    document.readyState==="loading"?document.addEventListener("DOMContentLoaded",marca):marca();
  };
  const iniciaLocal=async()=>{ await idbTodos(); if(!idb){ try{ const raw=localStorage.getItem(DBN); if(raw) Object.entries(JSON.parse(raw)).forEach(([k,v])=>mem.set(k,v)); }catch(e){} } };
  pronto=(NUVEM?iniciaNuvem():iniciaLocal()).catch(e=>{ console.error(e); status("Erro ao carregar a base: "+e.message); });

  const gravar=async(path,val)=>{
    if(NUVEM&&!editor){ aviso("Seu acesso é somente leitura."); throw Object.assign(new Error("Somente leitura"),{code:"somente_leitura"}); }
    if(val===undefined) mem.delete(path); else mem.set(path,val);
    await idbPut(path,val); avisa(path);
    if(!idb&&!NUVEM){ try{ const o={}; mem.forEach((v,k)=>o[k]=v); localStorage.setItem(DBN,JSON.stringify(o)); }catch(e){ throw Object.assign(new Error("Espaço cheio"),{code:"quota"}); } }
    if(NUVEM){ pend=pend.filter(o=>o.path!==path); pend.push(val===undefined?{path,del:true}:{path,data:val}); salvaPend(); esvazia(); } };
  const db={
    collection:col=>({ onSnapshot:f=>{ const un=addL(colL,col,f); pronto.then(()=>f(snapCol(col))); return un; }, get:async()=>{ await pronto; return snapCol(col); } }),
    doc:path=>({ set:async v=>{ await pronto; await gravar(path,clone(v)); },
      update:async v=>{ await pronto; await gravar(path,Object.assign({},mem.get(path)||{},clone(v))); },
      delete:async()=>{ await pronto; await gravar(path,undefined); },
      get:async()=>{ await pronto; return snapDoc(path); },
      onSnapshot:f=>{ const un=addL(docL,path,f); pronto.then(()=>f(snapDoc(path))); return un; } })
  };
  window.__modoNuvem=()=>({nuvem:NUVEM,editor,email:eu&&eu.email});
  window.__backupDados=async()=>{ await pronto; const o={}; mem.forEach((v,k)=>o[k]=v); return {app:"controle-iveco",versao:1,geradoEm:new Date().toISOString(),dados:o}; };
  window.__restaurarDados=async j=>{ await pronto; if(!j||j.app!=="controle-iveco"||!j.dados) throw new Error("Arquivo de backup inválido");
    if(NUVEM){ if(!editor) throw new Error("Seu acesso é somente leitura");
      const linhas=Object.entries(j.dados).map(([path,data])=>({path,data,updated_at:new Date().toISOString(),updated_by:eu.email}));
      for(let i=0;i<linhas.length;i+=200){ const {error}=await sb.from("docs").upsert(linhas.slice(i,i+200)); if(error) throw new Error(error.message); }
      const novos=new Set(Object.keys(j.dados)), velhos=[...mem.keys()].filter(k=>!novos.has(k));
      for(let i=0;i<velhos.length;i+=200){ const {error}=await sb.from("docs").delete().in("path",velhos.slice(i,i+200)); if(error) throw new Error(error.message); }
      return; }
    for(const k of [...mem.keys()]) await gravar(k,undefined); for(const [k,v] of Object.entries(j.dados)) await gravar(k,v); };
  const downloads={ save:async({filename,data,mimeType})=>{ const blob=data instanceof Blob?data:new Blob([data],{type:mimeType||"application/octet-stream"});
      try{ const f=new File([blob],filename,{type:blob.type}); if(/iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return; } }catch(e){ if(e&&e.name==="AbortError") throw Object.assign(new Error("cancelado"),{code:"declined"}); }
      const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000); } };
  window.claude={ use:async n=>n==="db"?db:n==="downloads"?downloads:null };
})();
</script>

<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#13202A; --muted:#5A6A77; --line:#D6DEE4;
  --accent:#0B6A84; --accent-ink:#FFFFFF; --accent-soft:#E0F0F4;
  --ok:#1C7F46; --ok-soft:#E3F3E9; --warn:#A8660A; --warn-soft:#FBF0DC; --crit:#B8322A; --crit-soft:#FBE5E2; --info:#4755A0; --info-soft:#E7E9F6;
  --need:#13202A; --shadow:0 1px 2px rgba(19,32,42,.06),0 4px 16px rgba(19,32,42,.05);
  --bi-green:#0B5B35; --bi-green2:#0E7243; --bi-tile:#C9EFCF; --bi-tile-ink:#0B3A22; --bi-grey:#C8CDD0; --bi-desc:#1E7F95;
  --bi-map:#E4EFDD; --bi-map-dot:#CFE0C4; --bi-map-line:#8FA88A; --bi-road:#F2B43C; --bi-road-bg:#FFFFFF; --bi-city:#34443C; --bi-water:#B9D8EA;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D151B; --surface:#141F27; --surface2:#1A2731; --ink:#E3EAEF; --muted:#8FA0AD; --line:#27363F;
    --accent:#44B2CC; --accent-ink:#06222B; --accent-soft:#12303A;
    --ok:#4CC07E; --ok-soft:#133224; --warn:#E3A43E; --warn-soft:#3A2B12; --crit:#F0766B; --crit-soft:#3D1C1A; --info:#8F9CE6; --info-soft:#1F2442;
    --need:#E3EAEF; --shadow:0 1px 2px rgba(0,0,0,.3);
    --bi-green:#0E6A3F; --bi-green2:#128052; --bi-tile:#173826; --bi-tile-ink:#CFF3D8; --bi-grey:#2A3238; --bi-desc:#52B7CC; --bi-map:#16261D; --bi-map-dot:#1F3528; --bi-map-line:#4F6B55; --bi-road:#D19A2E; --bi-road-bg:#0D1712; --bi-city:#D6E4DA; --bi-water:#1D3A4A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D151B; --surface:#141F27; --surface2:#1A2731; --ink:#E3EAEF; --muted:#8FA0AD; --line:#27363F;
  --accent:#44B2CC; --accent-ink:#06222B; --accent-soft:#12303A;
  --ok:#4CC07E; --ok-soft:#133224; --warn:#E3A43E; --warn-soft:#3A2B12; --crit:#F0766B; --crit-soft:#3D1C1A; --info:#8F9CE6; --info-soft:#1F2442;
  --need:#E3EAEF; --shadow:0 1px 2px rgba(0,0,0,.3);
    --bi-green:#0E6A3F; --bi-green2:#128052; --bi-tile:#173826; --bi-tile-ink:#CFF3D8; --bi-grey:#2A3238; --bi-desc:#52B7CC; --bi-map:#16261D; --bi-map-dot:#1F3528; --bi-map-line:#4F6B55; --bi-road:#D19A2E; --bi-road-bg:#0D1712; --bi-city:#D6E4DA; --bi-water:#1D3A4A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--f-mono);font-feature-settings:"zero" 1}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-cond);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stamps{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.stamps b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:6px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.conn{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-family:var(--f-cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-cond);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)} .kpi.acc .v{color:var(--accent)}

/* insights */
.insights{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 24px}
.insights h2{grid-column:1/-1;margin:0;font-family:var(--f-cond);font-size:16px;font-weight:700;letter-spacing:.02em}
.ins{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.ins i{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* table */

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.empty{padding:28px;text-align:center;color:var(--muted)}

/* timeline */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;padding:8px 0}

.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

table.ent-list{min-width:860px}

.cs-big{font-family:var(--f-cond);font-size:22px;font-weight:600}

.cs-stats{display:flex;flex-wrap:wrap;gap:8px 22px}

.cs-stats .crit b{color:var(--crit)} .cs-stats .warn b{color:var(--warn)} .cs-stats .ok b{color:var(--ok)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(470px,100%),1fr));gap:14px;align-items:start}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px 20px;display:flex;flex-direction:column;gap:12px;position:relative;cursor:pointer;box-shadow:var(--shadow);overflow:hidden}

.ccard[data-tone="crit"]::before{background:var(--crit)} .ccard[data-tone="warn"]::before{background:var(--warn)} .ccard[data-tone="ok"]::before{background:var(--ok)} .ccard[data-tone="info"]::before{background:var(--info)}

.rod{display:flex;flex-direction:column;gap:14px}

.a3-fsb{position:absolute;right:12px;bottom:12px;z-index:5;width:40px;height:40px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.92);color:#13202A;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.a3-fsb:hover{background:#fff}
.a3-clima{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12.5px}
.a3-cls{color:var(--muted)}.a3-cl{white-space:nowrap}
.a3-modal{position:fixed;inset:0;z-index:10050;background:rgba(10,20,30,.45);display:grid;place-items:center;padding:16px}
.a3-mbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.a3-clg{display:grid;gap:6px}.a3-clrow{display:grid;grid-template-columns:1.4fr 1.6fr 70px 80px auto;gap:8px;align-items:center}
.a3-clrow select,.a3-clrow input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;min-width:0}
@media (max-width:600px){.a3-clrow{grid-template-columns:1fr 1fr}}

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Torre de Controle · Portos RJ/Santos → Iveco MG</span>
      <h1>Necessidade Iveco × Follow-up</h1>
      <div class="stamps num">
        <span>Agora <b id="st-now">—</b></span>
        <span>Último follow <b id="st-follow">—</b></span>
        <span>Última programação <b id="st-prog">—</b></span>
        <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Conectando…</span></span>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="b-import" type="button">Importar e-mail / planilha</button>
      <button class="btn" id="b-new" type="button">Novo follow</button>
      <button class="btn" id="b-resumo" type="button">Resumo p/ cliente</button>
      <button class="btn" id="b-export" type="button">Exportar Excel</button>
      <button class="btn" id="b-backup" type="button" title="Salvar ou restaurar todos os dados deste aparelho">Backup</button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Indicadores"></section>
  <section class="insights" id="insights" aria-label="Análise"></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="bi" aria-selected="true" type="button">Painel BI</button>
    <button class="tab tab-3d" role="tab" data-tab="anim" aria-selected="false" type="button">🚛 Painel 3D</button>
    <button class="tab" role="tab" data-tab="crit" aria-selected="false" type="button">Críticos Iveco<span class="c crit" id="c-crit">0</span></button>
    <button class="tab" role="tab" data-tab="comp" aria-selected="false" type="button">Necessidade × Follow<span class="c" id="c-comp">0</span></button>
    <button class="tab" role="tab" data-tab="tl" aria-selected="false" type="button">Linha do tempo</button>
    <button class="tab" role="tab" data-tab="fora" aria-selected="false" type="button">Follow fora da programação<span class="c" id="c-fora">0</span></button>
    <button class="tab" role="tab" data-tab="prog" aria-selected="false" type="button">Programação Iveco<span class="c" id="c-prog">0</span></button>
    <button class="tab" role="tab" data-tab="rod" aria-selected="false" type="button">Rodovias<span class="c" id="c-rod">0</span></button>
    <button class="tab" role="tab" data-tab="ind" aria-selected="false" type="button">Indicadores</button>
  </nav>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Buscar container, motorista, placa…" aria-label="Buscar">
    <select id="f-dia" aria-label="Dia da necessidade"></select>
    <select id="f-sit" aria-label="Situação" hidden>
      <option value="">Todas as situações</option>
      <option value="crit">Crítico</option>
      <option value="warn">Atenção</option>
      <option value="info">Sem veículo (no prazo)</option>
      <option value="ok">No prazo / entregue</option>

    <label class="chk" id="w-socrit" hidden><input type="checkbox" id="f-socrit"> Só críticos Iveco</label>
    <div class="legend" hidden>
      <span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 L11 6 L6 11 L1 6Z" fill="none" stroke="var(--need)" stroke-width="1.6"/></svg>Necessidade Iveco</span>
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="var(--accent)"/></svg>Previsão / chegada (follow)</span>

  </div>

  <section id="v-bi" class="bi"></section>
  <section id="v-crit" class="crit-view" hidden></section>
  <section id="v-comp" class="tbl-wrap" hidden></section>

</div>

<script>
(function(){
"use strict";
const STALE_MIN = 75;           // follow é de hora em hora: acima disso marca como desatualizado
const RISK_MIN = 120;           // até 2h de atraso previsto = atenção; acima = crítico
const ST_ENVIAR="ENVIAR PARA A IVECO";
const STATUS_OPTS = ["EM PROGRAMAÇÃO","EM TRÂNSITO","AGUARDANDO CARREGAMENTO","AGUARDANDO DESCARGA","EM DESCARGA","ENTREGUE","EM MANUTENÇÃO","PARADO / OCORRÊNCIA","NÃO ENCONTRADO NO MAPA"];
// Betim é base/transbordo: entregue só conta quando o container chega na planta da Iveco (Sete Lagoas)
const KM_BETIM_IVECO=80;
const REGRA_BETIM=false; // regras de local de entrega/status desativadas a pedido: dados exatamente como na planilha
function viaBetim(f){ return REGRA_BETIM && !!f && /BETIM/.test(norm(f.local_entrega||"")); }
function naBetim(f){ return viaBetim(f) && !!f.chegada; }
function enviarIveco(f){ return viaBetim(f) && (f.status===ST_ENVIAR || /ENTREG/i.test(f.status||"")); }
function entregueIveco(f){ return !!(f && f.chegada) && !viaBetim(f); }
// Veículo em manutenção: reconhecido pelo status/localização do follow ou marcado na edição
const MANUT_RE=/MANUTEN|PANE|QUEBR|OFICINA|SOCORRO|BORRACHAR|PNEU|MEC[AÂ]NIC|GUINCHO|AVARIA|DEFEITO/i;
function emManut(f){ return !!(f && !f.chegada && (f.manut===true || MANUT_RE.test((f.status||"")+" "+(f.localizacao||"")))); }
function manutDesde(f){ const h=(f&&f.hist)||[]; let t=null; for(let i=h.length-1;i>=0;i--){ if(MANUT_RE.test((h[i].status||"")+" "+(h[i].loc||""))) t=h[i].t; else break; } return t||f.manutDesde||f.editadoEm||f.atualizadoEm||null; }
function manutTxt(f){ const d=manutDesde(f); return `Em manutenção${f.localizacao?` em ${lugar(f.localizacao)}`:""}${d?` desde ${fmt(d)}`:""}${f.manut_motivo?` · ${f.manut_motivo}`:""}${f.manut_lib?` · liberação prevista ${fmt(f.manut_lib)}`:""}`; }
function avisoManutCliente(fs){
  const now=new Date(); let t=`*Aviso Iveco – veículo em manutenção* (${fmt(now)})\n`;
  fs.forEach(f=>{ const irmaos=Object.values(state.follow).filter(x=>x.placa_cavalo&&x.placa_cavalo===f.placa_cavalo&&!x.chegada); const cns=irmaos.length?irmaos:[f];
    t+=`\nVeículo ${f.placa_cavalo||"—"}${f.placa_reboque?"/"+f.placa_reboque:""} – container${cns.length>1?"s":""} ${cns.map(x=>x.container).join(" e ")}\n`;
    cns.forEach(x=>{ const p=state.prog[x.container]; if(p&&p.necessidade) t+=`• ${x.container}: necessidade ${fmt(p.necessidade)}${isCrit(p)?` (${p.criticidade})`:""}\n`; });
    t+=`• Situação: em manutenção${f.localizacao?` em ${lugar(f.localizacao)}`:""}${manutDesde(f)?`, desde ${fmt(manutDesde(f))}`:""}\n`;
    if(f.manut_motivo) t+=`• Motivo: ${f.manut_motivo}\n`;
    t+= f.manut_lib ? `• Previsão de liberação: ${fmt(f.manut_lib)}\n` : `• Previsão de liberação: em avaliação\n`;
    if(f.prev_chegada) t+=`• Nova previsão de chegada: ${fmt(f.prev_chegada)}\n`; });
  return t+`\nEstamos avaliando a substituição do cavalo mecânico para minimizar o atraso e informaremos a cada atualização.`;
}

const state = { prog:{}, follow:{}, meta:{}, envios:{}, alertas:{}, rodMeta:{}, rodVer:"ativos", db:null, tab:"bi", bi:{cn:[],crit:[],dia:[],carga:["transito","porto","descarga","semveic"],sit:[],dest:[],prog:"",sel:""}, biOpen:null, biQ:"", q:"", dia:"", sit:"", periodo:"7", online:false };

function a3Load(){

function a3Tex(w,h,fn){ const c=document.createElement("canvas"); c.width=w; c.height=h; fn(c.getContext("2d"),w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t; }
function a3Sprite(txt,{cor="#13202A",fundo="rgba(255,255,255,.92)",tam=34,borda=null,escala=1}={}){
  const pad=18, c=document.createElement("canvas"), x=c.getContext("2d"); x.font=`700 ${tam}px Arial`; const w=Math.ceil(x.measureText(txt).width)+pad*2, h=tam+pad*1.2;
  c.width=w; c.height=h; x.font=`700 ${tam}px Arial`;
  x.fillStyle=fundo; const r=h/2; x.beginPath(); x.moveTo(r,0); x.lineTo(w-r,0); x.arc(w-r,r,r,-Math.PI/2,Math.PI/2); x.lineTo(r,h); x.arc(r,r,r,Math.PI/2,Math.PI*1.5); x.fill();
  if(borda){ x.lineWidth=5; x.strokeStyle=borda; x.stroke(); }
  x.fillStyle=cor; x.textBaseline="middle"; x.fillText(txt,pad,h/2+2);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; const m=new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true,sizeAttenuation:false}); const s=new THREE.Sprite(m);
  const k=.026*escala; s.scale.set(w/h*k,k,1); s.renderOrder=10; return s;
}

function a3TexPorta(){ // porta da cabine: logotipo da SADA (ou outro enviado pelo botão)
  return a3Tex(512,334,(x,w,h)=>{ x.clearRect(0,0,w,h);
    if(A3.logoImg){ const im=A3.logoImg, r=Math.min((w-16)/im.width,(h-16)/im.height); const iw=im.width*r, ih=im.height*r; x.drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih); }

}
/* ---------- geometria arredondada ---------- */
const A3_GEO={};
function a3RGeo(w,h,d,r,s=2){ r=Math.max(.001,Math.min(r,w/2-.001,h/2-.001,d/2-.001)); const key=[w,h,d,r,s].map(x=>x.toFixed(3)).join("|"); if(A3_GEO[key]) return A3_GEO[key];
  const n=2*s+1, g=new THREE.BoxGeometry(1,1,1,n,n,n), P=g.attributes.position, N=g.attributes.normal, sz=[w,h,d];
  const map=(v,size)=>{ const i=Math.round((v+.5)*n); if(i<=s) return -size/2+r*(i/s); if(i>=n-s) return size/2-r*((n-i)/s); return 0; };
  const p=new THREE.Vector3(), q=new THREE.Vector3(), UV=g.attributes.uv, fc=(n+1)*(n+1), eixos=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  const fr=(t,size)=>{ const i=Math.round(t*n); const c=i<=s?-size/2+r*(i/s):i>=n-s?size/2-r*((n-i)/s):0; return c/size+.5; };
  for(let i=0;i<UV.count;i++){ const f=Math.min(5,Math.floor(i/fc)), [su,sv]=eixos[f]; UV.setXY(i,fr(UV.getX(i),su),fr(UV.getY(i),sv)); }
  for(let i=0;i<P.count;i++){ p.set(map(P.getX(i),w),map(P.getY(i),h),map(P.getZ(i),d));
    q.set(Math.max(-w/2+r,Math.min(w/2-r,p.x)),Math.max(-h/2+r,Math.min(h/2-r,p.y)),Math.max(-d/2+r,Math.min(d/2-r,p.z)));
    p.sub(q); const l=p.length(); if(l>1e-6){ p.multiplyScalar(1/l); N.setXYZ(i,p.x,p.y,p.z); p.multiplyScalar(r); } p.add(q); P.setXYZ(i,p.x,p.y,p.z); }
  return (A3_GEO[key]=g); }

function a3Mat(c,o={}){ return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.15},o)); }

/* ---------- datas ---------- */
const pad = n => String(n).padStart(2,"0");
function toD(s){ if(!s) return null; const d = new Date(s); return isNaN(d) ? null : d; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmt(s){ const d = typeof s==="string"? toD(s) : s; if(!d) return "—"; return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtH(s){ const d = toD(s); return d? pad(d.getHours())+":"+pad(d.getMinutes()) : "—"; }
function dia(s){ return s ? s.slice(0,10) : ""; }
function diaBR(k){ return k ? k.slice(8,10)+"/"+k.slice(5,7)+"/"+k.slice(0,4) : ""; }
function dur(min){ const a=Math.abs(Math.round(min)); const h=Math.floor(a/60), m=a%60; return (min<0?"−":"+")+h+"h"+pad(m); }
function ago(s){ const d=toD(s); if(!d) return "—"; const m=Math.round((Date.now()-d)/60000); if(m<1) return "agora"; if(m<60) return "há "+m+" min"; const h=Math.floor(m/60); return "há "+h+"h"+pad(m%60); }
// Excel serial -> iso local (sem fuso)
function serialToIso(n){ const ms = Math.round((n-25569)*86400000); const d = new Date(ms); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+":"+pad(d.getUTCMinutes()); }
function parseVal(v){
  if(v==null) return null;
  if(typeof v==="number"){ if(v>0 && v<1){ const t=Math.round(v*1440); return {time:pad(Math.floor(t/60))+":"+pad(t%60)}; } if(v>20000 && v<80000) return {iso:serialToIso(v)}; return null; }
  if(v instanceof Date) return {iso:iso(v)};
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::\d{2})?)?$/))){ let y=+m[3]; if(y<100) y+=2000; return {iso:y+"-"+pad(m[2])+"-"+pad(m[1])+"T"+pad(m[4]||0)+":"+pad(m[5]||0)}; }
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/))) return {iso:m[1]+"-"+m[2]+"-"+m[3]+"T"+(m[4]||"00")+":"+(m[5]||"00")};
  if((m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/))) return {time:pad(m[1])+":"+m[2]};
  return null;
}
const pIso = v => { const r=parseVal(v); return r&&r.iso ? r.iso : null; };

/* ---------- análise ---------- */
function analisa(p, f, now){
  const need = toD(p.necessidade);
  const r = { tone:"info", label:"", gap:null, eta:null, flags:[], rank:3 };
  if(!need){ r.label="Sem horário de necessidade"; return r; }
  if(!f){
    if(now>need){ r.tone="crit"; r.label="Sem veículo · necessidade vencida"; r.gap=(now-need)/60000; }
    else { const falta=(need-now)/60000; r.tone = falta<360 ? "warn":"info"; r.label = "Sem veículo alocado"; r.flags.push({t:"info", s:"faltam "+dur(falta).slice(1)}); }
  } else {
    const prev = toD(f.prev_chegada), cheg = toD(f.chegada);
    if(cheg && viaBetim(f)){ const env=enviarIveco(f); r.tone = now>need ? "crit" : "warn"; r.label = env ? "Enviar para a Iveco (em Betim)" : "Em Betim · "+String(f.status||"").toLowerCase(); if(now>need) r.gap=(now-need)/60000; if(env) r.flags.push({t:"crit", s:`Entregue em Betim ${fmt(f.chegada)} · parado há ${dur((now-cheg)/60000).slice(1)}`}); }
    else if(cheg){ r.eta=f.chegada; r.gap=(cheg-need)/60000; r.tone = r.gap<=0 ? "ok" : (r.gap<=RISK_MIN?"warn":"crit"); r.label = r.gap<=0 ? "Entregue no prazo" : "Entregue com atraso"; }
    else if(!prev){ r.label = (f.status||"").toUpperCase().includes("CARREG")||(f.localizacao||"").toUpperCase().includes("CARREG") ? "No porto · aguardando carregamento" : "Sem previsão de chegada"; r.tone = now>need ? "crit" : "warn"; if(now>need) r.gap=(now-need)/60000; }
    else { r.eta=f.prev_chegada; r.gap=(prev-need)/60000; r.tone = r.gap<=0 ? "ok" : (r.gap<=RISK_MIN ? "warn" : "crit"); r.label = r.gap<=0 ? "No prazo" : (r.gap<=RISK_MIN ? "Risco de atraso" : "Atraso previsto"); }
    if(!cheg && viaBetim(f)) r.flags.push({t:"info", s:"Destino no follow: Betim"});
    const dp = toD(f.data_prog);
    if(emManut(f)){ r.flags.unshift({t:"crit", s:"🔧 "+manutTxt(f)}); if(r.tone!=="crit"){ r.tone="crit"; r.label="Veículo em manutenção"; } }
    if(dp && Math.abs(dp-need)>=60000) r.flags.push({t:"warn", s:"Follow informa programação "+fmt(f.data_prog)});
    if(!cheg && f.atualizadoEm && (now-toD(f.atualizadoEm))/60000 > STALE_MIN) r.flags.push({t:"crit", s:"Follow sem atualização "+ago(f.atualizadoEm)});
  }
  r.rank = {crit:0,warn:1,info:2,ok:3}[r.tone];
  return r;
}
const isLinha = p => /LINHA/i.test(p.criticidade||"");
const isCrit = p => !!(p && String(p.criticidade||"").trim());

function linhasComp(){
  const now = new Date();
  return Object.values(state.prog).map(p => ({p, f:state.follow[p.container], a:analisa(p, state.follow[p.container], now)}))
    .sort((x,y)=> x.a.rank-y.a.rank || (isLinha(y.p)-isLinha(x.p)) || String(x.p.necessidade).localeCompare(String(y.p.necessidade)));
}
function filtra(rows, pick){
  const q = state.q.trim().toUpperCase();
  return rows.filter(r => {
    if(state.dia && dia(r.p ? r.p.necessidade : "") !== state.dia && r.p) return false;
    if(state.sit && r.a && r.a.tone!==state.sit) return false;
    if(state.soCrit && r.p && !isCrit(r.p)) return false;
    if(!q) return true;
    return pick(r).toUpperCase().includes(q);
  });
}

  renderDias();
  const all = linhasComp();
  const scoped = all.filter(r => !state.dia || dia(r.p.necessidade)===state.dia);
  renderKpis(scoped); renderInsights(scoped);
  const rows = filtra(all, r => [r.p.container, r.f&&r.f.motorista, r.f&&r.f.placa_cavalo, r.f&&r.f.localizacao, r.p.solicitante, r.p.navio].join(" "));
  $("#c-comp").textContent = rows.length;
  renderComp(rows); renderTl(rows); renderFora(); renderProg(); renderInd(); renderCrit(); renderRod(); renderBI(); renderAnim();
}

function renderKpis(rows){
  const n=rows.length, com=rows.filter(r=>r.f).length, sem=n-com;
  const noPrazo=rows.filter(r=>r.a.tone==="ok").length;
  const atraso=rows.filter(r=>r.f && r.a.gap>0).length;
  const semVenc=rows.filter(r=>!r.f && r.a.tone==="crit").length;
  const linha=rows.filter(r=>isLinha(r.p)), linhaRisco=linha.filter(r=>r.a.tone!=="ok").length;
  const gaps=rows.filter(r=>r.f && r.a.eta && r.a.gap!=null).map(r=>r.a.gap);
  const med = gaps.length ? gaps.reduce((a,b)=>a+b,0)/gaps.length : null;
  const ader = n ? Math.round(noPrazo/n*100) : 0;
  const k=(cls,t,v,s)=>`<div class="kpi ${cls}"><span class="k">${t}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  $("#kpis").innerHTML =
    k("acc","Programados",n,"containers solicitados")+
    k(com<n?"warn":"ok","Com veículo",com,`${n?Math.round(com/n*100):0}% com follow`)+
    k(sem?"crit":"ok","Sem veículo",sem,`${semVenc} já vencidos`)+
    k(atraso?"crit":"ok","Atraso x necessidade",atraso,"em trânsito ou no porto")+
    k(linhaRisco?"crit":"ok","Item p/ linha em risco",linhaRisco,`de ${linha.length} críticos`)+
    k(med>0?"warn":"ok","Desvio médio ETA",med==null?"—":dur(med),"previsão − necessidade")+
    k(ader>=90?"ok":(ader>=70?"warn":"crit"),"Aderência",ader+"%","no prazo ou entregue");
}

function renderInsights(rows){
  const out=[]; const now=new Date();
  const n=rows.length; if(!n){ $("#insights").innerHTML='<h2>Análise</h2><div class="ins info"><i></i><span>Importe a programação da Iveco para ver a análise.</span></div>'; return; }
  const semVenc=rows.filter(r=>!r.f && toD(r.p.necessidade)<now);
  const sem=rows.filter(r=>!r.f);
  const porto=rows.filter(r=>r.f && !r.f.prev_chegada && !r.f.chegada);
  const linhaRisco=rows.filter(r=>isLinha(r.p) && r.a.tone!=="ok");
  const div=rows.filter(r=>r.a.flags.some(f=>f.s.startsWith("Follow informa")));
  const stale=rows.filter(r=>r.a.flags.some(f=>f.s.startsWith("Follow sem")));
  const trans=rows.filter(r=>r.f && r.a.eta && !r.f.chegada);
  const melhor=trans.slice().sort((a,b)=>a.a.gap-b.a.gap)[0];
  const pior=trans.slice().sort((a,b)=>b.a.gap-a.a.gap)[0];
  const cn = arr => arr.slice(0,6).map(r=>`<span class="mono">${esc(r.p.container)}</span>`).join(", ")+(arr.length>6?` e mais ${arr.length-6}`:"");
  if(linhaRisco.length) out.push(["crit",`<b>${linhaRisco.length} de ${rows.filter(r=>isLinha(r.p)).length} itens para linha</b> não atendem a necessidade: ${cn(linhaRisco)}. Priorizar escalonamento com o cliente.`]);
  if(sem.length) out.push(["crit",`<b>${sem.length} containers programados sem veículo no follow</b>${semVenc.length?` (${semVenc.length} já passaram do horário)`:""}: ${cn(sem)}.`]);
  if(porto.length) out.push(["warn",`<b>${porto.length} ainda no porto aguardando carregamento</b>, sem previsão de chegada: ${cn(porto)}.`]);
  if(trans.length) out.push([pior&&pior.a.gap>RISK_MIN?"crit":"warn",`Em trânsito: <b>${trans.filter(r=>r.a.gap<=0).length} de ${trans.length}</b> chegam dentro da necessidade. Maior atraso previsto: <span class="mono">${esc(pior.p.container)}</span> ${dur(pior.a.gap)}; mais próximo: <span class="mono">${esc(melhor.p.container)}</span> ${dur(melhor.a.gap)}.`]);
  if(div.length) out.push(["warn",`<b>${div.length} follows informam horário programado diferente</b> da programação Iveco: ${cn(div)}. Alinhar a coluna DATA PROGRAMADA do follow com a do cliente.`]);
  if(stale.length) out.push(["crit",`<b>${stale.length} follows sem atualização há mais de ${STALE_MIN} min</b>. O combinado é de hora em hora: importe o último e-mail.`]);
  if(!out.length) out.push(["ok","Todos os containers programados estão cobertos e dentro da necessidade."]);
  $("#insights").innerHTML = '<h2>Análise · necessidade do cliente × follow-up</h2>' + out.map(([t,h])=>`<div class="ins ${t}"><i></i><span>${h}</span></div>`).join("");
}

function renderTl(rows){
  const el=$("#v-tl"); if(el.hidden) return;
  const now=new Date();
  const items=rows.filter(r=>toD(r.p.necessidade)).slice().sort((a,b)=>String(a.p.necessidade).localeCompare(String(b.p.necessidade)));
  if(!items.length){ el.innerHTML='<div class="empty">Sem dados para a linha do tempo.</div>'; return; }
  let t0=Infinity,t1=-Infinity;
  items.forEach(r=>{ [r.p.necessidade, r.a.eta].forEach(s=>{const d=toD(s); if(d){t0=Math.min(t0,+d);t1=Math.max(t1,+d);}}); });
  t0=Math.min(t0,+now); t1=Math.max(t1,+now);
  const H=3600000; t0=Math.floor(t0/H)*H - H; t1=Math.ceil(t1/H)*H + H;
  const W=Math.max(760, el.clientWidth-2), L=128, R=24, top=30, rh=26, h=top+items.length*rh+10;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R);
  const span=(t1-t0)/H, step= span>36?6: span>18?3: span>9?2:1;
  let g="";
  for(let t=t0;t<=t1;t+=H){ const d=new Date(t); if(d.getHours()%step) continue; const X=x(t); g+=`<line class="grid" x1="${X}" x2="${X}" y1="${top-6}" y2="${h-6}"/><text x="${X}" y="${top-12}" text-anchor="middle">${d.getHours()===0?pad(d.getDate())+"/"+pad(d.getMonth()+1):pad(d.getHours())+"h"}</text>`; }
  const col={crit:"var(--crit)",warn:"var(--warn)",ok:"var(--ok)",info:"var(--info)"};
  items.forEach((r,i)=>{
    const y=top+i*rh+rh/2, xn=x(+toD(r.p.necessidade)), c=col[r.a.tone];
    g+=`<text class="lbl" x="8" y="${y+4}">${esc(r.p.container)}</text>`;
    if(isLinha(r.p)) g+=`<text x="${L-8}" y="${y+4}" text-anchor="end" style="fill:var(--crit);font-weight:700">L</text>`;
    if(r.a.eta){ const xe=x(+toD(r.a.eta)); g+=`<line x1="${xn}" x2="${xe}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="${xe}" cy="${y}" r="5" fill="${c}"/><text x="${xe+(xe>=xn?9:-9)}" y="${y+4}" text-anchor="${xe>=xn?"start":"end"}" style="fill:${c};font-weight:600">${dur(r.a.gap)}</text>`; }
    else { g+=`<text x="${xn+10}" y="${y+4}" style="fill:${c}">${r.f?"sem previsão":"sem veículo"}</text>`; }
    g+=`<path d="M${xn} ${y-6} L${xn+6} ${y} L${xn} ${y+6} L${xn-6} ${y}Z" fill="var(--surface)" stroke="var(--need)" stroke-width="1.6"/>`;
  });
  const xnw=x(+now); g+=`<line class="now" x1="${xnw}" x2="${xnw}" y1="${top-6}" y2="${h-6}"/><text class="nowt" x="${xnw+4}" y="${h-10}">agora ${fmtH(iso(now))}</text>`;
  el.innerHTML=`<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" role="img" aria-label="Linha do tempo: necessidade Iveco versus previsão de chegada">${g}</svg>`;
}

/* ---------- críticos Iveco ---------- */
function proximoPasso(r, lead, now){
  const p=r.p, f=r.f, need=toD(p.necessidade), quem=p.solicitante&&!/^FIFO$/i.test(p.solicitante)?p.solicitante:"o solicitante Iveco";
  const passos=[];
  if(emManut(f)) passos.push(`Veículo em manutenção: avisar ${quem} agora e avaliar troca do cavalo mecânico para seguir com o container.`);
  if(r.a.flags.some(x=>x.s.startsWith("Follow sem"))) passos.push("Atualizar a posição: o follow está sem atualização.");
  if(!f || (!f.chegada && !f.prev_chegada)){
    const acao = !f ? "Alocar veículo" : "Priorizar o carregamento no terminal";
    if(lead){ const saidaMax=new Date(need-lead*60000), chegaAgora=new Date(+now+lead*60000);
      passos.push(saidaMax>now ? `${acao}: para cumprir, a saída precisa ocorrer até ${fmt(saidaMax)} (viagem média de ${dur(lead).slice(1)}).`
        : `${acao}. Mesmo saindo agora, a chegada estimada é ${fmt(chegaAgora)} (${dur((chegaAgora-need)/60000)} sobre a necessidade). Negociar nova janela com ${quem}.`); }
    else passos.push(`${acao} e informar ${quem} sobre a nova janela.`);
  } else if(f.chegada){ passos.push(r.a.gap>0?"Entregue com atraso: registrar a causa.":"Entregue no prazo."); }
  else if(r.a.gap>0){ passos.push(`Informar ${quem} da previsão ${fmt(f.prev_chegada)} (${dur(r.a.gap)}) e confirmar se a linha suporta a espera.`); }
  else passos.push("Dentro do prazo: manter o acompanhamento de hora em hora.");
  const dv=r.a.flags.find(x=>x.s.startsWith("Follow informa")); if(dv) passos.push(`Corrigir no follow o horário programado para ${fmt(p.necessidade)} (hoje está ${dv.s.replace("Follow informa programação ","")}).`);
  return passos;
}
function trilha(r, now){
  const f=r.f, need=toD(r.p.necessidade); if(!f||!f.inicio) return "";
  const ini=toD(f.inicio), fim=toD(f.chegada)||toD(f.prev_chegada); if(!ini||!fim) return "";
  const t0=+ini, t1=Math.max(+fim,+need,+now), pos=t=>Math.max(0,Math.min(100,(t-t0)/(t1-t0)*100));
  const pNow=pos(+now), pNeed=pos(+need), pFim=pos(+fim), tone=r.a.tone;
  return `<div class="trilha" aria-label="Andamento da viagem">
    <div class="tr-track"><div class="tr-fill ${tone}" style="width:${f.chegada?pFim:Math.min(pNow,pFim)}%"></div>
      ${need>=ini?`<span class="tr-need" style="left:${pNeed}%" title="Necessidade ${fmt(r.p.necessidade)}"></span>`:""}
      ${!f.chegada?`<span class="tr-now" style="left:${pNow}%" title="Agora"></span>`:""}
      <span class="tr-end ${tone}" style="left:${pFim}%" title="${f.chegada?"Chegada":"Previsão"} ${fmt(f.chegada||f.prev_chegada)}"></span></div>
    <div class="tr-lbl"><span>Saída ${fmt(f.inicio)}</span><span>${f.chegada?"Chegada":"Previsão"} ${fmt(f.chegada||f.prev_chegada)}</span></div></div>`;
}
function listaCrit(rows, lead, now){
  return `<div class="tbl-wrap"><table class="crit-list"><thead><tr><th></th><th>Container</th><th>Necessidade</th><th>Prazo</th><th>Situação</th><th>Posição atual</th><th>Previsão</th><th>× Necessidade</th><th>Veículo</th><th>Solicitante</th></tr></thead><tbody>${
    rows.map(r=>{ const p=r.p,f=r.f,a=r.a, falta=(toD(p.necessidade)-now)/60000, entregue=f&&f.chegada;
      const cd = entregue ? `<span class="sub">entregue</span>` : falta>0 ? `<b class="${falta<180?"t-warn":"t-info"}">vence em ${dur(falta).slice(1)}</b>` : `<b class="t-crit">vencida há ${dur(-falta).slice(1)}</b>`;
      const passos=proximoPasso(r,lead,now);
      return `<tr data-cn="${esc(p.container)}" data-tone="${r.tone2}" tabindex="0"><td class="sev"></td>
        <td><div class="cn">${esc(p.container)}</div><span class="linha">${esc(p.criticidade)}</span></td>
        <td class="num"><b>${fmt(p.necessidade)}</b></td>
        <td style="white-space:nowrap">${cd}</td>
        <td><span class="pill ${r.tone2}">${esc(a.label)}</span>${a.flags.some(x=>x.s.startsWith("Follow sem"))?`<div class="chips"><span class="chip crit">follow desatualizado</span></div>`:""}</td>
        <td>${f?esc(lugar(f.localizacao)):'<span class="sub">Sem veículo</span>'}</td>
        <td class="num" style="white-space:nowrap">${r.est?`<span title="Estimativa se sair agora">≈ ${fmt(r.est)}</span><div class="sub">se sair agora</div>`:(f?fmt(f.chegada||f.prev_chegada):"—")}</td>
        <td><span class="gap ${r.gap2==null?"":r.tone2}">${r.gap2!=null?(r.est?"≈ ":"")+dur(r.gap2):"—"}</span></td>
        <td>${f?`<span class="mono">${esc(f.placa_cavalo||"")}</span><div class="sub">${esc(f.motorista||"")}</div>`:'<span class="sub">—</span>'}</td>
        <td>${esc(p.solicitante||"—")}</td></tr>
        <tr class="nx-row" data-cn="${esc(p.container)}" data-tone="${r.tone2}"><td class="sev"></td><td colspan="9"><span class="cc-next-t">Próximo passo</span> ${passos.map(esc).join(" <span class=\"sub\">·</span> ")}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function cardCrit(r, lead, now){
  const p=r.p,f=r.f,a=r.a, need=toD(p.necessidade), falta=(need-now)/60000;
  const cd = falta>0 ? `Vence em ${dur(falta).slice(1)}` : `Vencida há ${dur(-falta).slice(1)}`;
  const prevs=(f&&f.hist||[]).filter(h=>h.prev).map(h=>h.prev); const drift = prevs.length>1 && prevs[0]!==prevs[prevs.length-1] ? `Previsão mudou de ${fmt(prevs[0])} para ${fmt(prevs[prevs.length-1])}` : "";
  const passos=proximoPasso(r,lead,now);
  return `<article class="ccard" data-cn="${esc(p.container)}" data-tone="${r.tone2}" tabindex="0">
    <header class="cc-head"><div><div class="cc-cn">${esc(p.container)}</div><div class="sub">${esc(p.navio||"")} · ${esc(p.carga||"")}${p.desova==="SIM"?" · com desova":""}</div></div>
      <div class="cc-tags"><span class="linha">${esc(p.criticidade)}</span><span class="pill ${r.tone2}">${esc(a.label)}</span></div></header>
    <div class="cc-clock ${falta>0?(falta<180?"warn":"info"):"crit"}"><span class="cc-need">Necessidade <b>${fmt(p.necessidade)}</b></span><span class="cc-cd">${cd}</span></div>

function textoRodCliente(whats){

  t+= graves.length ? `${whats?"⚠️ ":""}${graves.length} ocorrência(s) com impacto no trajeto:\n${graves.map(x=>li+x.a.titulo+(x.a.km?` (km ${x.a.km})`:"")).join("\n")}\n\n` : `${whats?"✅ ":""}Até o momento, sem acidentes ou interdições identificados no trajeto Rio → Sete Lagoas/Betim.\n\n`;

  const km=kmRestante(f), dest=rotaDe(f)===ROTA.BETIM?"Betim":"Sete Lagoas";

/* ---------- expectativa de chegadas no dia (recebimento até 23:00) ---------- */
const CORTE_H=23;
function biChegadas(rows, now){
  const hoje=iso(now).slice(0,10), corte=new Date(now); corte.setHours(CORTE_H,0,0,0);
  const lead=calcInd("tudo").lead;
  const porPlaca={}; rows.filter(r=>r.f).forEach(r=>{ const k=r.placa||r.cn; (porPlaca[k]=porPlaca[k]||[]).push(r); });
  const out={chegou:[],ate:[],limite:[],depois:[],vencida:[],manut:[],betim:[],corte};
  Object.entries(porPlaca).forEach(([placa,rs])=>{ const f=rs[0].f;
    const v={placa, reboque:f.placa_reboque||"", motorista:f.motorista||"", rs, f, dest:rs[0].dest, crit:rs.some(r=>r.crit), tone:rs.map(r=>r.tone).sort((a,b)=>({crit:0,warn:1,info:2,ok:3}[a]-{crit:0,warn:1,info:2,ok:3}[b]))[0]};
    if(enviarIveco(f)){ v.eta=f.chegada?toD(f.chegada):toD(f.prev_chegada); v.betimTxt=f.chegada?`em Betim desde ${fmt(f.chegada)}`:`a caminho de Betim (${lugar(f.localizacao)})`; if(!f.chegada||dia(f.chegada)===hoje||rs.some(r=>r.nd&&r.nd<now)) out.betim.push(v); return; }
    if(f.chegada){ if(dia(f.chegada)===hoje){ v.eta=toD(f.chegada); out.chegou.push(v); } return; }
    const q=restante(f,now); v.rest=q;
    if(emManut(f)){ v.eta=toD(f.prev_chegada)||null; v.manut=true; out.manut.push(v); return; }
    if(f.prev_chegada && toD(f.prev_chegada)<now){ v.eta=toD(f.prev_chegada); out.vencida.push(v); return; }
    v.eta = q&&q.eta ? q.eta : null; v.est = q&&q.est;
    if(!v.eta) return;
    v.margem=(corte-v.eta)/60000;
    v.ex=exposicao(f,now,lead).filter(x=>x.nivel==="crit"||x.nivel==="warn");
    if(v.eta<=corte){ (v.margem<=60 ? out.limite : out.ate).push(v); } else out.depois.push(v);
  });
  ["chegou","ate","limite","depois","vencida","manut","betim"].forEach(k=>out[k].sort((a,b)=>(a.eta||0)-(b.eta||0)));
  return out;
}
function chegGrafico(C, now){
  const W=900, H=205, L=34, R=16, T=42, B=34, horas=[]; const h0=0, h1=26; // 00h até 02h do dia seguinte
  const base=new Date(now); base.setHours(0,0,0,0);

  const bins={}; const add=(v,k)=>{ if(!v.eta) return; let hh=Math.floor((v.eta-base)/3600000); if(hh<h0) hh=h0; if(hh>=h1) hh=h1-1; const b=(bins[hh]=bins[hh]||{chegou:0,ate:0,limite:0,depois:0}); b[k]++; };
  C.chegou.forEach(v=>add(v,"chegou")); C.ate.forEach(v=>add(v,"ate")); C.limite.forEach(v=>add(v,"limite")); C.depois.forEach(v=>add(v,"depois"));
  const max=Math.max(1,...Object.values(bins).map(b=>b.chegou+b.ate+b.limite+b.depois));
  const y=v=>T+(H-T-B)*(1-v/max), bw=(W-L-R)/(h1-h0)-4;
  let g=`<rect x="${x(new Date(+base+CORTE_H*3600000))}" y="${T-8}" width="${x(new Date(+base+h1*3600000))-x(new Date(+base+CORTE_H*3600000))}" height="${H-T-B+8}" fill="var(--crit-soft)" opacity=".6"/>`;
  for(let v=0; v<=max; v+=Math.max(1,Math.ceil(max/4))) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  for(let hh=h0; hh<h1; hh+=2){ const t=new Date(+base+hh*3600000); g+=`<text x="${x(t)+bw/2+2}" y="${H-14}" text-anchor="middle">${pad(hh%24)}h</text>`; }
  const cores={chegou:"var(--bi-desc)",ate:"var(--ok)",limite:"var(--warn)",depois:"var(--crit)"}, nomes={chegou:"já chegaram",ate:"chegam até 22h",limite:"no limite (22h–23h)",depois:"após 23h"};
  Object.entries(bins).forEach(([hh,b])=>{ let acc=0; const bx=x(new Date(+base+hh*3600000))+2;
    ["chegou","ate","limite","depois"].forEach(k=>{ const n=b[k]; if(!n) return; const y1=y(acc+n), h=y(acc)-y1-(acc?2:0);
      g+=`<rect x="${bx}" y="${y1}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${cores[k]}"><title>${pad(hh%24)}h: ${n} veículo${n>1?"s":""} ${nomes[k]}</title></rect>`; acc+=n; });
    g+=`<text x="${bx+bw/2}" y="${y(acc)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${acc}</text>`; });
  const xc=x(new Date(+base+CORTE_H*3600000)), xn=x(now);
  g+=`<line x1="${xc}" x2="${xc}" y1="${T-24}" y2="${H-B}" stroke="var(--crit)" stroke-width="2" stroke-dasharray="5 4"/><text x="${xc-4}" y="${T-28}" text-anchor="end" style="fill:var(--crit);font-weight:700">fim do recebimento 23:00</text>`;
  g+=`<line x1="${xn}" x2="${xn}" y1="${T-24}" y2="${H-B}" stroke="var(--accent)" stroke-width="2"/><text x="${xc-xn<230?xn-4:xn+4}" y="${T-28}" text-anchor="${xc-xn<230?"end":"start"}" style="fill:var(--accent);font-weight:700">agora ${fmtH(iso(now))}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="cheg-svg" role="img" aria-label="Chegadas previstas por hora hoje, com o fim do recebimento às 23h">${g}</svg>`;
}
function chegTexto(C, now){

function buildProg(c,o,now){
  let necessidade=null; const e=parseVal(o.expectativa), h=parseVal(o.horario);
  if(e&&e.iso){ necessidade = e.iso.slice(0,11) + (h&&h.time ? h.time : (h&&h.iso ? h.iso.slice(11,16) : e.iso.slice(11,16))); }
  const ld=o.local_descarga;
  return { container:c, data_carregamento:pIso(o.data_carregamento), planta:txt(o.planta), solicitante:txt(o.solicitante), carga:txt(o.carga), desova:txt(o.desova).toUpperCase(),
    navio:txt(o.navio), necessidade, or:txt(o.or), shipment:txt(o.shipment), tipo_veiculo:txt(o.tipo_veiculo), obs:txt(o.obs), transportadora:txt(o.transportadora),
    local_descarga: ld==null?"":txt(ld), limite_devolucao:pIso(o.limite_devolucao), criticidade:txt(o.criticidade).toUpperCase(), atualizadoEm:now };
}
function histEntry(f,t,orig){ return {t:t||f.atualizadoEm, orig:orig||"planilha", status:f.status||"", loc:f.localizacao||"", prev:f.prev_chegada||null, cheg:f.chegada||null}; }
function withHist(novo, antigo, t, orig){
  const h = (antigo && Array.isArray(antigo.hist)) ? antigo.hist.slice() : [];
  const e = histEntry(novo,t,orig), last=h[h.length-1];
  if(!last || last.status!==e.status || last.loc!==e.loc || last.prev!==e.prev || last.cheg!==e.cheg) h.push(e);
  else if(e.orig==="planilha") h[h.length-1] = Object.assign({}, last, {t:e.t, orig:"planilha"});
  novo.hist = h.slice(-48); return novo;
}
async function gravar(parsed){
  if(!state.db) throw new Error("Sem conexão com a base. Recarregue a página.");
  const now=iso(new Date()); let nf=0, np=0;
  // Follow: as informações mais recentes ficam nas últimas linhas.
  // Lê de baixo para cima e usa só a linha mais recente de cada container.
  const vistos=new Set(), recentes=[]; let ignoradas=0;
  for(let i=parsed.follow.length-1;i>=0;i--){ const r=parsed.follow[i];
    const novos=r.ids.filter(c=>!vistos.has(c)); if(!novos.length){ ignoradas++; continue; }
    novos.forEach(c=>vistos.add(c)); recentes.push({ids:novos,o:r.o}); }
  for(const r of recentes){ for(const f of buildFollow(r.ids,r.o,now)){ await state.db.doc("follow/"+f.container).set(withHist(f, state.follow[f.container])); nf++; } }
  for(const r of parsed.prog){ const p=buildProg(r.container,r.o,now); await state.db.doc("prog/"+p.container).set(p); np++; }
  if(nf){ const k=now.slice(0,10), atual=(state.envios[k]&&state.envios[k].horarios)||[];
    await state.db.doc("envios/"+k).set({dia:k, horarios:[...new Set([...atual, now])].sort()}); }
  const meta=Object.assign({}, state.meta); if(nf) meta.ultimoFollow=now; if(np) meta.ultimaProg=now;
  if(nf||np) await state.db.doc("meta/info").set(meta);
  let cid={novas:[],falhas:[]}; try{ cid=await autoCidades(parsed.follow.map(r=>({localizacao:txt(r.o.localizacao)}))); }catch(e){}
  return {nf,np,ignoradas,cid};
}
function gridFromText(t){
  const lines=t.replace(/\r/g,"").split("\n");
  const sep = lines.some(l=>l.includes("\t")) ? "\t" : (lines.some(l=>l.includes(";"))?";":"\t");
  return lines.map(l=>l.split(sep).map(c=>c.trim()));
}
function gridsFromWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"}); const out={prog:[],follow:[]};
  wb.SheetNames.forEach(n=>{ const ws=wb.Sheets[n];
    // Recalcula a área real da aba a partir das células preenchidas, para não depender da dimensão gravada no arquivo
    // e varrer tudo, inclusive blocos que vêm depois de linhas em branco.
    let r0=Infinity,c0=Infinity,r1=-1,c1=-1; Object.keys(ws).forEach(k=>{ if(k[0]==="!") return; const a=XLSX.utils.decode_cell(k); r0=Math.min(r0,a.r); c0=Math.min(c0,a.c); r1=Math.max(r1,a.r); c1=Math.max(c1,a.c); });
    if(r1<0) return; ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:r1,c:c1}});
    const g=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true}); const r=parseGrid(g); out.prog.push(...r.prog); out.follow.push(...r.follow); });
  return out;
}

function consExtrai(txt){ const u=String(txt||"").toUpperCase(); const m=u.match(/[A-Z]{4}\s?-?\s?\d{6}\s?-?\s?\d/g)||[]; return [...new Set(m.map(x=>x.replace(/[^A-Z0-9]/g,"")))]; }
function consLinhas(cns){
  const now=new Date(), L=new Map(biLinhas().map(r=>[r.cn,r]));
  return cns.map(cn=>{ const f=state.follow[cn]||null, p=state.prog[cn]||null, r=L.get(cn)||null, q=f&&!f.chegada?restante(f,now):null;
    return {cn,f,p,r,q}; });
}
function consSit(o){ if(!o.f&&!o.p) return {k:"mut",t:"Não encontrado"}; if(!o.f) return {k:"info",t:"Sem veículo"};
  if(emManut(o.f)) return {k:"crit",t:"Em manutenção"};
  if(o.r){ const c=o.r.carga; if(c==="entregue") return {k:"ok",t:"Entregue"}; if(c==="descarga") return {k:"desc",t:"Aguard. descarga"}; if(c==="porto") return {k:o.r.tone,t:"No porto"};
    return {k:o.r.tone,t:BI_SIT[o.r.tone]||"Em trânsito"}; }
  return {k:"info",t:o.f.status||"—"}; }
function consTexto(rows){
  return rows.map(o=>{ const f=o.f; if(!f&&!o.p) return `• ${o.cn} – não encontrado no follow nem na programação`;
    if(!f) return `• ${o.cn} – sem veículo alocado – nec. ${fmt(o.p.necessidade)}`;
    const prev=f.chegada?`chegou ${fmt(f.chegada)}`:f.prev_chegada?`prev. ${fmt(f.prev_chegada)}`:(o.q&&o.q.eta?`prev. ≈ ${fmt(iso(o.q.eta))}`:"sem previsão");
    return `• ${o.cn} – ${f.status||"—"} – ${lugar(f.localizacao)} – ${f.placa_cavalo||"—"}${f.placa_reboque?"/"+f.placa_reboque:""} – ${prev}${o.q&&o.q.km!=null?` – faltam ${o.q.km} km`:""}`; }).join("\n");
}

        prev.innerHTML=`<div class="msg err">A colagem chegou, mas sem imagem (conteúdo: ${esc(tipos)}). Recorte de novo com Win+Shift+S e cole em seguida, ou use Escolher arquivo de imagem.</div>`; } };
    document.addEventListener("paste",onPaste,true);
    drop.onclick=()=>drop.focus();
    drop.addEventListener("beforeinput",e=>{ if(e.inputType!=="insertFromPaste") e.preventDefault(); });
    drop.addEventListener("input",()=>{ drop.innerHTML="Pronto! Agora pressione<br><b>Ctrl+V</b><br><span>para colar o print</span>"; });

    el.querySelector("#c-file").onchange=e=>{ const f=e.target.files[0]; if(f) lerImagem(f); e.target.value=""; };
    [drop,ta].forEach(z=>{ z.addEventListener("dragover",e=>{ e.preventDefault(); drop.classList.add("on"); }); z.addEventListener("dragleave",()=>drop.classList.remove("on"));
      z.addEventListener("drop",e=>{ const f=imgDe(e.dataTransfer); drop.classList.remove("on"); if(f){ e.preventDefault(); lerImagem(f); } }); });
    draw(); setTimeout(()=>{ ta.focus(); ta.select(); },50);
  });
}

function textoResumo(){
  const now=new Date(); const rows=linhasComp().filter(r=>!state.dia||dia(r.p.necessidade)===state.dia)
    .sort((a,b)=>String(a.p.necessidade).localeCompare(String(b.p.necessidade)));
  const n=rows.length, com=rows.filter(r=>r.f).length;
  let t=`*IVECO – Necessidade x Posição dos veículos*\nAtualizado ${fmt(now)}\n\nProgramados: ${n} | Com veículo: ${com} | Sem veículo: ${n-com}\n`;
  const blocos=[["Em trânsito",r=>r.f&&r.a.eta&&!r.f.chegada],["Aguardando carregamento no porto",r=>r.f&&!r.a.eta],["Entregues",r=>r.f&&r.f.chegada],["Aguardando alocação de veículo",r=>!r.f]];
  blocos.forEach(([nome,fn])=>{ const b=rows.filter(fn); if(!b.length) return; t+=`\n*${nome} (${b.length})*\n`;
    b.forEach(r=>{ const f=r.f; t+=`• ${r.p.container}${isLinha(r.p)?" [LINHA]":""} – nec. ${fmt(r.p.necessidade)}`;
      if(f){ t+= f.chegada?` – chegou ${fmt(f.chegada)}`:(f.prev_chegada?` – ${f.localizacao} – prev. ${fmt(f.prev_chegada)}`:` – ${f.localizacao}`); }
      t+="\n"; }); });
  return t;
}
/* ---------- resumo visual para o cliente ---------- */
const CL = { bg:"#F2F6F8", card:"#FFFFFF", ink:"#13202A", muted:"#5F6F7B", line:"#DCE3E8", zebra:"#F7FAFB",
  band:"#0E3441", bandInk:"#FFFFFF", bandSub:"#9FC3CE", accent:"#0B6A84", late:"#B8322A", ontime:"#1C7F46",
  st:{ manut:["#B8322A","#FBE5E2"], betim:["#A8660A","#FBEFD8"], ok:["#1C7F46","#E1F2E7"], trans:["#2B5AA6","#E4EDFA"], desc:["#0B6A84","#DDF0F4"], porto:["#A8660A","#FBEFD8"], sem:["#56656F","#E9EEF1"] } };
const ORDEM_ST = ["manut","betim","trans","desc","porto","sem","ok"];
const NOME_ST = { manut:"Veículo em manutenção", betim:"Em Betim (aguarda envio à Iveco)", trans:"Em trânsito", desc:"Aguardando descarga", porto:"Aguardando carregamento", sem:"Aguardando veículo", ok:"Entregue" };
function stCliente(r){ const f=r.f; if(!f) return "sem"; if(enviarIveco(f)) return "betim"; if(f.chegada) return "ok"; if(emManut(f)) return "manut"; if(/DESCARGA/i.test(f.status||"")) return "desc"; if(!f.prev_chegada && !/AGUARDANDO CARREG|PORTO|PROGRAMA/i.test((f.localizacao||"")+" "+(f.status||""))) return "trans"; if(f.prev_chegada) return "trans"; return "porto"; }
function lugar(s){
  s=(s||"").replace(/\s*AGUARDANDO.*$/i,"").trim(); if(!s) return "—";
  return s.toLowerCase().replace(/(^|[\s\-\/(])(\S)/g,(m,a,b)=>a+b.toUpperCase())
    .replace(/\b(De|Do|Da|Dos|Das|E)\b/g,w=>w.toLowerCase()).replace(/(^|[\s\-])([a-z]{2})$/i,(m,a,b)=>a+b.toUpperCase());
}
function resumoRows(){
  return linhasComp().filter(r=>!state.dia||dia(r.p.necessidade)===state.dia)
    .map(r=>Object.assign(r,{st:stCliente(r)}))
    .sort((a,b)=>String(a.p.necessidade).localeCompare(String(b.p.necessidade)));

function desvioCliente(r){
  if(r.st==="sem"||r.st==="porto"||r.a.gap==null||!r.a.eta) return null;
  return r.a.gap<=0 ? {t:"No prazo", c:CL.ontime} : {t:dur(r.a.gap), c:CL.late};
}
function refDia(rows){ const ds=[...new Set(rows.map(r=>dia(r.p.necessidade)).filter(Boolean))].sort(); return ds.length===1? diaBR(ds[0]) : ds.length? diaBR(ds[0])+" a "+diaBR(ds[ds.length-1]) : ""; }

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fit(ctx,t,max){ t=String(t??""); if(ctx.measureText(t).width<=max) return t; while(t.length>1 && ctx.measureText(t+"…").width>max) t=t.slice(0,-1); return t+"…"; }
const FNT=(w,s,f)=>`${w} ${s}px ${f==="m"?'"IBM Plex Mono",ui-monospace,Menlo,monospace':f==="c"?'"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif':'"IBM Plex Sans",Arial,sans-serif'}`;
function pill(ctx,x,y,k,txt){ ctx.font=FNT(600,13); const w=ctx.measureText(txt).width+22; rr(ctx,x,y,w,26,13); ctx.fillStyle=CL.st[k][1]; ctx.fill(); ctx.fillStyle=CL.st[k][0]; ctx.textBaseline="middle"; ctx.fillText(txt,x+11,y+13.5); ctx.textBaseline="alphabetic"; return w; }
function tagLinha(ctx,x,y){ ctx.font=FNT(700,11,"c"); const t="ITEM P/ LINHA", w=ctx.measureText(t).width+12; rr(ctx,x,y,w,18,4); ctx.strokeStyle=CL.late; ctx.lineWidth=1.2; ctx.stroke(); ctx.fillStyle=CL.late; ctx.textBaseline="middle"; ctx.fillText(t,x+6,y+9.5); ctx.textBaseline="alphabetic"; return w; }

async function desenhaResumo(modo, comDesvio){

  let bodyH = modo==="tabela" ? 46+rows.length*rowH : grupos.reduce((s,g)=>s+44+Math.ceil(g.rows.length/COLS)*(cardH+GAP),0);

  const cv=document.createElement("canvas"); cv.width=W*S; cv.height=H*S; const ctx=cv.getContext("2d"); ctx.scale(S,S);

  const kw=(IW-12*(kp.length-1))/kp.length;
  kp.forEach(([t,v,c],i)=>{ const x=P+i*(kw+12); rr(ctx,x,kpiY,kw,kpiH,10); ctx.fillStyle=CL.card; ctx.fill(); ctx.strokeStyle=CL.line; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=c; ctx.fillRect(x+14,kpiY+16,4,kpiH-32);
    ctx.font=FNT(700,34,"c"); ctx.fillText(String(v),x+28,kpiY+50); ctx.fillStyle=CL.muted; ctx.font=FNT(500,13); ctx.fillText(fit(ctx,t,kw-40),x+28,kpiY+70); });

  if(!rows.length){ ctx.fillStyle=CL.muted; ctx.font=FNT(400,16); ctx.fillText("Nenhum container programado para o período selecionado.",P,bodyY+40); }
  else if(modo==="tabela"){
    const cols = comDesvio

      : [["Container",0,260],["Necessidade",260,140],["Situação",400,230],["Posição atual",630,290],["Previsão",920,180]];
    rr(ctx,P,bodyY,IW,bodyH,12); ctx.fillStyle=CL.card; ctx.fill(); ctx.strokeStyle=CL.line; ctx.stroke();
    ctx.save(); rr(ctx,P,bodyY,IW,bodyH,12); ctx.clip();
    ctx.fillStyle=CL.band; ctx.fillRect(P,bodyY,IW,46);
    ctx.fillStyle=CL.bandInk; ctx.font=FNT(600,13,"c"); if("letterSpacing" in ctx) ctx.letterSpacing="1px";
    cols.forEach(([t,x])=>ctx.fillText(t.toUpperCase(),P+18+x,bodyY+29)); if("letterSpacing" in ctx) ctx.letterSpacing="0px";
    rows.forEach((r,i)=>{ const y=bodyY+46+i*rowH, cy=y+rowH/2+5, X=c=>P+18+cols[c][1];
      if(i%2){ ctx.fillStyle=CL.zebra; ctx.fillRect(P,y,IW,rowH); }
      ctx.fillStyle=CL.st[r.st][0]; ctx.fillRect(P,y,5,rowH);
      ctx.strokeStyle=CL.line; ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(P+IW,y); ctx.stroke();
      ctx.fillStyle=CL.ink; ctx.font=FNT(600,15,"m"); ctx.fillText(r.p.container,X(0),cy); const cw=ctx.measureText(r.p.container).width;
      if(isLinha(r.p)) tagLinha(ctx,X(0)+cw+10,cy-14);
      ctx.fillStyle=CL.ink; ctx.font=FNT(600,15); ctx.fillText(fmt(r.p.necessidade),X(1),cy);
      pill(ctx,X(2),y+(rowH-26)/2,r.st,NOME_ST[r.st]);
      ctx.fillStyle=r.f?CL.ink:CL.muted; ctx.font=FNT(400,14); ctx.fillText(fit(ctx,r.f?lugar(r.f.localizacao):"—",cols[3][2]-16),X(3),cy);
      ctx.font=FNT(500,15); ctx.fillStyle=CL.ink; const prev=r.f&&r.f.chegada?"chegou "+fmt(r.f.chegada):(r.f&&r.f.prev_chegada?fmt(r.f.prev_chegada):"—"); ctx.fillText(prev,X(4),cy);
      if(comDesvio){ const d=desvioCliente(r); ctx.font=FNT(600,15,"m"); ctx.fillStyle=d?d.c:CL.muted; ctx.fillText(d?d.t:"—",X(5),cy); }
    });
    ctx.restore();
  } else {
    let y=bodyY;
    grupos.forEach(g=>{
      const [c,soft]=CL.st[g.k];
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(P+7,y+17,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=CL.ink; ctx.font=FNT(700,20,"c"); ctx.fillText(`${NOME_ST[g.k]}`,P+24,y+24);
      const tw=ctx.measureText(NOME_ST[g.k]).width; ctx.fillStyle=CL.muted; ctx.font=FNT(500,16,"c"); ctx.fillText(`(${g.rows.length})`,P+32+tw,y+24);
      y+=44;
      g.rows.forEach((r,i)=>{ const cx=P+(i%COLS)*(cardW+GAP), cy=y+Math.floor(i/COLS)*(cardH+GAP);
        rr(ctx,cx,cy,cardW,cardH,12); ctx.fillStyle=CL.card; ctx.fill(); ctx.strokeStyle=CL.line; ctx.lineWidth=1; ctx.stroke();
        ctx.save(); rr(ctx,cx,cy,cardW,cardH,12); ctx.clip(); ctx.fillStyle=c; ctx.fillRect(cx,cy,6,cardH); ctx.restore();
        const ix=cx+22, iw=cardW-40;
        ctx.fillStyle=CL.ink; ctx.font=FNT(600,18,"m"); ctx.fillText(r.p.container,ix,cy+34);
        if(isLinha(r.p)){ ctx.font=FNT(700,11,"c"); const w=ctx.measureText("ITEM P/ LINHA").width+12; tagLinha(ctx,cx+cardW-18-w,cy+20); }
        const linhaInfo=(lb,val,yy,bold)=>{ ctx.fillStyle=CL.muted; ctx.font=FNT(500,13); ctx.fillText(lb,ix,yy); ctx.fillStyle=CL.ink; ctx.font=FNT(bold?600:400,14); ctx.textAlign="right"; ctx.fillText(fit(ctx,val,iw-110),ix+iw,yy); ctx.textAlign="left"; };
        ctx.strokeStyle=CL.line; ctx.beginPath(); ctx.moveTo(ix,cy+50); ctx.lineTo(ix+iw,cy+50); ctx.stroke();

        if(comDesvio){ const d=desvioCliente(r); ctx.fillStyle=CL.muted; ctx.font=FNT(500,13); ctx.fillText("Previsão × necessidade",ix,cy+144); ctx.font=FNT(600,14,"m"); ctx.fillStyle=d?d.c:CL.muted; ctx.textAlign="right"; ctx.fillText(d?d.t:"—",ix+iw,cy+144); ctx.textAlign="left"; }
      });
      y+=Math.ceil(g.rows.length/COLS)*(cardH+GAP);
    });
  }
  // rodapé
  ctx.fillStyle=CL.muted; ctx.font=FNT(400,13);
  ctx.fillText("Informações do monitoramento de hora em hora. Horários sujeitos a alteração conforme trânsito, carregamento e descarga.",P,H-30);
  return cv;
}

/* ---------- resumo para o gerente (WhatsApp) ---------- */
const GER_COR={crit:"#B8322A",warn:"#A8660A",ok:"#1C7F46",info:"#4755A0",desc:"#1E7F95",done:"#5A6A77"};
const GER_EMO={crit:"🔴",warn:"🟠",ok:"🟢",info:"⚪",desc:"🔵",done:"✅"};
const tomLinha=r=>r.carga==="descarga"?"desc":r.carga==="entregue"?"done":r.tone;
function biFiltrosTxt(){
  const b=state.bi, out=[];
  const dest=A(b.dest), dias=A(b.dia), crit=A(b.crit), sit=A(b.sit), cn=A(b.cn), carga=A(b.carga);
  if(dest.length) out.push("Planta "+dest.join(" / "));
  if(dias.length) out.push("Expectativa "+dias.map(d=>d==="__hoje__"?"hoje":diaBR(d).slice(0,5)).join(", "));
  if(crit.length) out.push(crit.map(c=>c==="__crit__"?"Críticos Iveco":c==="__sem__"?"Sem criticidade":c).join(", "));
  if(sit.length) out.push(sit.map(s=>BI_SIT[s]).join(", "));
  if(carga.length && !mesmo(carga,CARGA_PADRAO)) out.push(carga.map(c=>BI_CARGA[c]).join(", "));
  if(cn.length) out.push(cn.length<=3?cn.join(", "):cn.length+" containers selecionados");
  if(b.prog==="prog") out.push("Só programação Iveco");
  return out.join(" · ");
}
function gerDados(){
  const now=new Date(), b=state.bi, base=biLinhas(), rows=biFiltra(base);
  const mapa=rows.filter(r=>r.carga!=="entregue"||A(b.carga).includes("entregue"));
  const RK={crit:0,warn:1,info:2,ok:3};
  const lista=rows.slice().sort((a,c)=>(RK[a.tone]-RK[c.tone])||(!!c.crit-!!a.crit)||String(a.need).localeCompare(String(c.need)));
  const cont=(fn)=>{ const m={}; rows.forEach(r=>{ const k=fn(r); m[k]=(m[k]||0)+1; }); return m; };
  const alertas=listaAlertas().filter(a=>statusAl(a,now).k==="ativo").concat(listaAlertas().filter(a=>statusAl(a,now).k==="prog"&&statusAl(a,now).ini-now<24*3600000)).slice(0,5)
    .map(a=>{ const s=statusAl(a,now); return {titulo:a.titulo, quando:s.t, tom:s.k==="prog"?"info":(a.tipo==="acidente"||a.tipo==="interdicao"||a.sev==="alta")?"crit":"warn"}; });
  const C=biChegadas(biFiltra(base,"carga").filter(r=>r.carga!=="semveic"), now);
  // agrupamento por posição (como no mapa), do mais perto ao mais longe da planta
  const grupos={}; mapa.filter(r=>r.f).forEach(r=>{ const k=r.node||("?"+lugar(r.f.localizacao)); const g=grupos[k]=grupos[k]||{k, nome:r.node&&NO[r.node]?NO[r.node].n:lugar(r.f.localizacao), veic:{}, km:null};
    const q=r.f.chegada?null:restante(r.f,now); const kk=r.f.chegada?0:(q&&q.km!=null?q.km:null); if(kk!=null) g.km=g.km==null?kk:Math.min(g.km,kk);
    const v=g.veic[r.placa||r.cn]=g.veic[r.placa||r.cn]||{placa:r.placa, reboque:r.f.placa_reboque||"", rs:[], f:r.f, q}; v.rs.push(r); });
  const posicoes=Object.values(grupos).map(g=>({...g, veic:Object.values(g.veic)})).sort((a,c)=>(a.km==null?1e9:a.km)-(c.km==null?1e9:c.km));
  const manut=[...new Set(rows.filter(r=>r.manut).map(r=>r.placa))];
  return {now, rows, mapa, lista, posicoes, alertas, C, manut,
    carga:cont(r=>r.carga), dest:cont(r=>r.dest), sit:cont(r=>r.tone),
    critRisco:rows.filter(r=>r.crit&&r.tone!=="ok"&&r.carga!=="entregue"),
    semVeic:rows.filter(r=>r.carga==="semveic"), filtros:biFiltrosTxt(), veics:new Set(mapa.filter(r=>r.f&&r.node&&r.carga!=="entregue").map(r=>r.placa)).size};
}
function textoGerente(d){
  const L=[], n=d.rows.length, now=d.now;
  L.push("*🚛 Torre de Controle · Carga Iveco*");
  L.push(`*Resumo da operação* – ${fmt(now)}`);
  L.push(`Último follow: ${state.meta.ultimoFollow?fmt(state.meta.ultimoFollow):"—"}`);
  if(d.filtros) L.push(`_Filtro: ${d.filtros}_`);
  L.push("");
  L.push(`*Processos: ${n}* · 🔴 Atrasados *${d.sit.crit||0}* · 🟠 Em risco *${d.sit.warn||0}* · 🟢 No prazo *${d.sit.ok||0}*`);
  const ordC=["transito","porto","betim","descarga","semveic","entregue"];
  if(d.critRisco.length) L.push(`⚠️ Críticos Iveco em risco: *${d.critRisco.length}* (${d.critRisco.map(r=>r.cn).join(", ")})`);
  if(d.manut.length) L.push(`🔧 Em manutenção: *${d.manut.length}* (${d.manut.join(", ")})`);
  const ate=d.C.ate.concat(d.C.limite);
  L.push(`🕚 Chegam hoje até 23h: *${ate.length}* veículo${ate.length===1?"":"s"}${ate.length?" ("+ate.map(v=>`${v.placa} ${fmtH(iso(v.eta))}`).join(", ")+")":""}${d.C.chegou.length?` · já chegaram hoje: *${d.C.chegou.length}*`:""}`);
  L.push("");
  L.push(`*📍 Posição dos veículos* (${d.veics} no corredor)`);
  if(!d.posicoes.length) L.push("Nenhum veículo em rota para o filtro atual.");
  d.posicoes.forEach(g=>{
    L.push(""); L.push(`*${g.nome}*${g.km===0?" – na planta":g.km!=null?` – ${g.km} km da planta`:""}`);
    g.veic.forEach(v=>{ const r0=v.rs.slice().sort((a,c)=>({crit:0,warn:1,info:2,ok:3}[a.tone]-{crit:0,warn:1,info:2,ok:3}[c.tone]))[0], t=tomLinha(r0);
      const cab=`${GER_EMO[t]} ${v.rs.map(r=>r.cn+(r.crit?` [${r.crit}]`:"")).join(" + ")} · ${v.placa||"sem placa"}`;
      if(r0.carga==="descarga"||r0.carga==="entregue"){ L.push(`${cab} – ${r0.carga==="descarga"?"aguardando descarga desde "+fmtH(v.f.chegada):"entregue "+fmt(v.f.chegada)}`); return; }
      L.push(cab);
      let det;
      if(r0.manut) det="🔧 "+manutTxt(v.f);
      else if(r0.carga==="descarga") det=`no cliente desde ${fmt(v.f.chegada)} · aguardando descarga`;
      else if(r0.carga==="entregue") det=`entregue ${fmt(v.f.chegada)}`;
      else if(v.q) det=v.q.txt; else det="posição sem distância cadastrada";
      const nec=v.rs.map(r=>r.need?fmt(r.need):"—").join(" / ");
      const des=r0.carga==="entregue"||r0.carga==="descarga"?"":(r0.gap!=null?` · ${dur(r0.gap)} (${BI_SIT[r0.tone].toLowerCase()})`:` · ${BI_SIT[r0.tone].toLowerCase()}`);
      L.push(`   ${det}`);
      L.push(`   Nec. ${nec}${des}`);
    });
