<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre Iveco</title>
<meta name="description" content="Torre de controle SADA × Iveco: necessidade × follow-up, painel BI, rodovias e painel 3D.">
<meta name="theme-color" content="#0F1B24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Torre Iveco">
<script>try{var t=localStorage.getItem("iveco.tema");if(t)document.documentElement.dataset.theme=t;if(localStorage.getItem("iveco.menu")==="min")document.documentElement.classList.add("sb-min");}catch(e){}</script>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="app-shell.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-tab" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 9v11"/></symbol>
    <symbol id="i-fc" viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-bi" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-anim" viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
    <symbol id="i-crit" viewBox="0 0 24 24"><path d="M7 18v-6a5 5 0 0 1 10 0v6M5 18h14v3H5zM12 3v2M4.2 6.2l1.4 1.4M19.8 6.2l-1.4 1.4"/></symbol>
    <symbol id="i-comp" viewBox="0 0 24 24"><path d="M7 4v13M7 17l-3-3M7 17l3-3M17 20V7M17 7l-3 3M17 7l3 3"/></symbol>
    <symbol id="i-tl" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-fora" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M10 13.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4M12 18.6v.1"/></symbol>
    <symbol id="i-prog" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/></symbol>
    <symbol id="i-rod" viewBox="0 0 24 24"><path d="M8 3 4 21M16 3l4 18M12 4v3M12 10.5v3M12 17v3"/></symbol>
    <symbol id="i-ind" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5v13c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-13M4 12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-dev" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
  </defs>
</svg>

<div class="app-bar" id="app-bar" hidden><span id="app-txt">Instale o controle no celular ou no computador para abrir como aplicativo.</span><button type="button" id="app-inst">Instalar app</button><button type="button" class="gh" id="app-x">Agora não</button></div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="servicos.js"></script>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="xlsx.full.min.js"></script>

<div class="shell">
  <!-- MENU LATERAL -->
  <aside class="sb" id="sb" aria-label="Menu">
    <div class="sb-brand">
      <span class="sb-logo"><svg><use href="#i-anim"/></svg></span>
      <span class="sb-name"><b>Torre Iveco</b><small>Torre de Controle · RJ/Santos → MG</small></span>
      <button class="sb-close only-m" id="sh-fecha" type="button" aria-label="Fechar menu"><svg><use href="#i-x"/></svg></button>
    </div>
    <nav class="sb-nav tabs" role="tablist">
      <span class="sb-grp">Operação</span>
      <button class="tab" role="tab" data-tab="tab" aria-selected="true" type="button" title="Tabela"><svg><use href="#i-tab"/></svg><span class="t">Tabela</span></button>
      <button class="tab" role="tab" data-tab="fc" aria-selected="false" type="button" title="Follow cliente"><svg><use href="#i-fc"/></svg><span class="t">Follow cliente</span></button>
      <button class="tab" role="tab" data-tab="crit" aria-selected="false" type="button" title="Críticos Iveco"><svg><use href="#i-crit"/></svg><span class="t">Críticos Iveco</span><span class="c crit" id="c-crit">0</span></button>
      <button class="tab" role="tab" data-tab="comp" aria-selected="false" type="button" title="Necessidade × Follow"><svg><use href="#i-comp"/></svg><span class="t">Necessidade × Follow</span><span class="c" id="c-comp">0</span></button>
      <span class="sb-grp">Painéis</span>
      <button class="tab" role="tab" data-tab="bi" aria-selected="false" type="button" title="Painel BI"><svg><use href="#i-bi"/></svg><span class="t">Painel BI</span></button>
      <button class="tab" role="tab" data-tab="anim" aria-selected="false" type="button" title="Painel 3D"><svg><use href="#i-anim"/></svg><span class="t">Painel 3D</span></button>
      <button class="tab" role="tab" data-tab="tl" aria-selected="false" type="button" title="Linha do tempo"><svg><use href="#i-tl"/></svg><span class="t">Linha do tempo</span></button>
      <button class="tab" role="tab" data-tab="ind" aria-selected="false" type="button" title="Indicadores"><svg><use href="#i-ind"/></svg><span class="t">Indicadores</span></button>
      <span class="sb-grp">Cadastros</span>
      <button class="tab" role="tab" data-tab="prog" aria-selected="false" type="button" title="Programação Iveco"><svg><use href="#i-prog"/></svg><span class="t">Programação Iveco</span><span class="c" id="c-prog">0</span></button>
      <button class="tab" role="tab" data-tab="fora" aria-selected="false" type="button" title="Follow fora da programação"><svg><use href="#i-fora"/></svg><span class="t">Fora da programação</span><span class="c" id="c-fora">0</span></button>
      <button class="tab" role="tab" data-tab="rod" aria-selected="false" type="button" title="Rodovias"><svg><use href="#i-rod"/></svg><span class="t">Rodovias</span><span class="c" id="c-rod">0</span></button>
    </nav>
    <div class="sb-foot">
      <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Conectando…</span></span>
      <div class="sb-tools">
        <button class="ic-btn" id="sh-tema" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema"><svg><use href="#i-moon"/></svg></button>
        <button class="ic-btn only-d" id="sh-min" type="button" title="Recolher / expandir menu" aria-label="Recolher menu"><svg><use href="#i-side"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="sb-scrim" id="sb-scrim" hidden></div>

  <!-- CONTEÚDO -->
  <div class="main">
    <header class="topbar top">
      <button class="ic-btn only-m" id="sh-abre" type="button" aria-label="Abrir menu"><svg><use href="#i-menu"/></svg></button>
      <div class="tb-title brand">
        <span class="eyebrow" id="sh-grupo">Operação</span>
        <h1 id="sh-titulo">Tabela</h1>
        <div class="stamps num">
          <span>Agora <b id="st-now">—</b></span>
          <span>Último follow <b id="st-follow">—</b></span>
          <span>Última programação <b id="st-prog">—</b></span>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="b-import" type="button" title="Importar e-mail / planilha"><svg><use href="#i-up"/></svg><span class="lbl">Importar</span></button>
        <button class="btn" id="b-new" type="button" title="Novo follow"><svg><use href="#i-plus"/></svg><span class="lbl">Novo follow</span></button>
        <button class="btn hide-s" id="b-resumo" type="button" title="Resumo para o cliente"><svg><use href="#i-msg"/></svg><span class="lbl">Resumo p/ cliente</span></button>
        <div class="mais">
          <button class="ic-btn" id="sh-mais" type="button" aria-haspopup="menu" aria-expanded="false" title="Mais opções"><svg><use href="#i-more"/></svg></button>
          <div class="pop" id="sh-pop" role="menu" hidden>
            <button type="button" role="menuitem" class="only-s" id="sh-resumo"><svg><use href="#i-msg"/></svg>Resumo p/ cliente</button>
            <button type="button" role="menuitem" id="b-export"><svg><use href="#i-down"/></svg>Exportar Excel</button>
            <button type="button" role="menuitem" id="b-backup"><svg><use href="#i-db"/></svg>Backup dos dados</button>
            <button type="button" role="menuitem" id="sh-ins"><svg><use href="#i-eye"/></svg><span>Ocultar resumo do dia</span></button>
            <button type="button" role="menuitem" id="sh-inst" hidden><svg><use href="#i-dev"/></svg>Instalar como aplicativo</button>
          </div>
        </div>
      </div>
    </header>

    <div class="wrap">
      <section class="kpis" id="kpis" aria-label="Indicadores"></section>
      <section class="insights" id="insights" aria-label="Análise"></section>

      <div class="toolbar">
        <input id="q" type="search" placeholder="Buscar container, motorista, placa…" aria-label="Buscar">
        <select id="f-dia" aria-label="Dia da necessidade"></select>
        <select id="f-sit" aria-label="Situação" hidden>
          <option value="">Todas as situações</option>
          <option value="crit">Crítico</option>
          <option value="warn">Atenção</option>
          <option value="info">Sem veículo (no prazo)</option>
          <option value="ok">No prazo / entregue</option>
        </select>
        <label class="chk" id="w-socrit" hidden><input type="checkbox" id="f-socrit"> Só críticos Iveco</label>
        <div class="legend" hidden>
          <span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 L11 6 L6 11 L1 6Z" fill="none" stroke="var(--need)" stroke-width="1.6"/></svg>Necessidade Iveco</span>
          <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="var(--accent)"/></svg>Previsão / chegada (follow)</span>
        </div>
      </div>

      <section id="v-tab" class="tbsec"></section>
      <section id="v-fc" class="tbsec" hidden></section>
      <section id="v-bi" class="bi" hidden></section>
      <section id="v-crit" class="crit-view" hidden></section>
      <section id="v-comp" class="tbl-wrap" hidden></section>
      <section id="v-tl" class="tl" hidden></section>
      <section id="v-fora" class="tbl-wrap" hidden></section>
      <section id="v-prog" class="tbl-wrap" hidden></section>
      <section id="v-rod" class="rod" hidden></section>
      <section id="v-ind" class="ind" hidden></section>
      <section id="v-anim" class="a3" hidden></section>
    </div>
  </div>

  <!-- BARRA INFERIOR (celular) -->
  <nav class="bn" aria-label="Navegação rápida">
    <button class="tab" data-tab="tab" aria-selected="true" type="button"><svg><use href="#i-tab"/></svg><span>Tabela</span></button>
    <button class="tab" data-tab="fc" aria-selected="false" type="button"><svg><use href="#i-fc"/></svg><span>Follow</span></button>
    <button class="tab" data-tab="bi" aria-selected="false" type="button"><svg><use href="#i-bi"/></svg><span>BI</span></button>
    <button class="tab" data-tab="anim" aria-selected="false" type="button"><svg><use href="#i-anim"/></svg><span>3D</span></button>
    <button class="bn-mais" id="sh-bn-mais" type="button"><svg><use href="#i-menu"/></svg><span>Menu</span></button>
  </nav>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
<script src="instalacao.js"></script>
<script src="shell.js"></script>
</body>
</html>
