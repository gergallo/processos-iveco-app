    const baixar=async i=>{ const dl=await window.claude?.use?.("downloads"); if(!dl){ msg("Download indisponível nesta visualização. Use Copiar.",false); return false; }
      try{ await dl.save({filename:nome(i), data:await blob(cvs[i])}); return true; }catch(e){ if(e.code!=="declined") msg("Não foi possível salvar ("+e.code+").",false); return false; } };
    { let op={mapa:true,det:true}; try{ op=Object.assign(op,JSON.parse(localStorage.getItem("iveco.gerOp")||"{}")); }catch(e){} el.querySelector("#g-omapa").checked=op.mapa; el.querySelector("#g-odet").checked=op.det;
      ["#g-omapa","#g-odet"].forEach(id=>el.querySelector(id).onchange=()=>{ if(!el.querySelector("#g-omapa").checked&&!el.querySelector("#g-odet").checked){ el.querySelector(id).checked=true; return; } gera(); }); }
    const gera=async()=>{ d=gerDados(); ta.value=textoGerente(d); link(); const op={mapa:el.querySelector("#g-omapa").checked,det:el.querySelector("#g-odet").checked}; try{ localStorage.setItem("iveco.gerOp",JSON.stringify(op)); }catch(e){} cvs=await desenhaGerente(d,op);
      box.innerHTML=cvs.map((cv,i)=>`<figure class="ger-pg"><figcaption><b>${cvs.length>1?(i+1)+" · ":""}${esc(cv.tit||"Resumo")}</b><span><button class="btn sm" type="button" data-cp="${i}">Copiar</button> <button class="btn sm" type="button" data-dl="${i}">Baixar</button></span></figcaption><img src="${cv.toDataURL("image/png")}" alt="${esc(cv.tit||"Resumo")}"></figure>`).join(""); seqCp=0; atualizaCp(); el.querySelector("#g-png").textContent=cvs.length>1?`Baixar as ${cvs.length} imagens`:"Baixar imagem"; el.querySelector("#g-share").textContent=cvs.length>1?"Compartilhar as 2 imagens":"Compartilhar imagem";
      box.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.cp; copiar(i); if(cvs.length>1) setTimeout(()=>msg(`Imagem ${i+1} (${cvs[i].tit}) copiada. Cole no WhatsApp (Ctrl+V).`,true),150); });
      box.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{ if(await baixar(+b.dataset.dl)) msg("Imagem salva.",true); });
      
      try{ const fs=await arquivos(); el.querySelector("#g-share").hidden=!(navigator.canShare&&navigator.canShare({files:fs})); }catch(e){} };
    ta.oninput=link; fo.oninput=()=>{ link(); try{ localStorage.setItem("iveco.gerenteFone",fo.value); }catch(e){} };
    el.querySelector("#g-x").onclick=closePanel;
    let seqCp=0; const atualizaCp=()=>{ const b=el.querySelector("#g-cimg"); if(!b) return; b.textContent=cvs.length>1?`Copiar imagem ${seqCp+1} de ${cvs.length}`:"Copiar imagem"; };
    el.querySelector("#g-cimg").onclick=()=>{ const i=seqCp; copiar(i); if(cvs.length>1){ seqCp=(seqCp+1)%cvs.length; atualizaCp(); setTimeout(()=>msg(i===0?`Imagem 1 (${cvs[0].tit}) copiada. Cole no WhatsApp (Ctrl+V) e clique de novo para copiar a imagem 2.`:`Imagem 2 (${cvs[1].tit}) copiada. Cole no WhatsApp (Ctrl+V).`,true),150); } };
    el.querySelector("#g-pdf").onclick=async()=>{ const bt=el.querySelector("#g-pdf"); bt.disabled=true; const old=bt.textContent; bt.textContent="Gerando PDF…";
      try{ const buf=await gerPdf(cvs); const dl=await window.claude?.use?.("downloads"); if(!dl){ msg("Download indisponível nesta visualização.",false); return; }
        await dl.save({filename:nome(0).replace(/\.png$/,".pdf"),data:new Uint8Array(buf)}); msg("PDF salvo. No WhatsApp, anexe como Documento.",true); }
      catch(e){ if(e&&e.code==="declined"){} else msg("Não foi possível gerar o PDF ("+((e&&(e.code||e.message))||"erro")+").",false); }
      finally{ bt.disabled=false; bt.textContent=old; } };
    el.querySelector("#g-ref").onclick=async()=>{ await gera(); msg("Resumo atualizado com os dados de agora.",true); };
    el.querySelector("#g-png").onclick=async()=>{ let n=0; for(let i=0;i<cvs.length;i++){ if(await baixar(i)) n++; else break; } if(n) msg(`${n} imagem${n>1?"ns":""} salva${n>1?"s":""}. Anexe na conversa do WhatsApp com o gerente.`,true); };
    el.querySelector("#g-share").onclick=async()=>{ try{ await navigator.share({files:await arquivos(), text:ta.value}); }catch(e){ if(e.name!=="AbortError") msg("Não foi possível compartilhar daqui. Use Copiar ou Baixar.",false); } };
    el.querySelector("#g-ctxt").onclick=()=>navigator.clipboard.writeText(ta.value).then(()=>msg("Texto copiado. Cole na conversa do WhatsApp.",true),()=>msg("Não foi possível copiar o texto.",false));
    await gera();
  });
}

async function exportar(){
  if(typeof XLSX==="undefined"){ toast("Leitor de planilha indisponível"); return; }
  const now=new Date();
  const comp=linhasComp().map(r=>({"Container":r.p.container,"Necessidade Iveco":fmt(r.p.necessidade),"Criticidade":r.p.criticidade||"","Situação":r.a.label,"Alertas":r.a.flags.map(f=>f.s).join(" | "),
    "Status follow":r.f?r.f.status:"","Localização":r.f?r.f.localizacao:"","Previsão":r.f?fmt(r.f.prev_chegada):"","Chegada":r.f?fmt(r.f.chegada):"","Desvio (h)":r.a.gap!=null?Math.round(r.a.gap/6)/10:"",
    "Placa":r.f?r.f.placa_cavalo:"","Motorista":r.f?r.f.motorista:"","Navio":r.p.navio,"Solicitante":r.p.solicitante,"Descarga":r.p.local_descarga}));
  const fol=Object.values(state.follow).map(f=>({"Container":f.container,"ID original":f.idOriginal,"Local de entrega":f.local_entrega,"Status":f.status,"Localização":f.localizacao,"Início":fmt(f.inicio),"Prev. chegada":fmt(f.prev_chegada),"Data programada":fmt(f.data_prog),"Chegada":fmt(f.chegada),"Placa cavalo":f.placa_cavalo,"Placa reboque":f.placa_reboque,"Motorista":f.motorista,"Atualizado":fmt(f.atualizadoEm)}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(comp),"Necessidade x Follow");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fol),"Follow");
  const I=calcInd(state.periodo), pct=v=>v==null?"":Math.round(v*1000)/10, hrs=v=>v==null?"":Math.round(v/6)/10;
  const indRows=[
    ["Período",PERIODOS[state.periodo]],["Programados",I.prog.length],["Cobertura de veículo (%)",pct(I.cobertura)],["Sem veículo com necessidade vencida",I.semVencidos.length],
    ["Entregues",I.entregues.length],["Pontualidade de entrega - OTD (%)",pct(I.otd)],["OTD itens para linha (%)",pct(I.otdLinha)],["Atraso médio das entregas atrasadas (h)",hrs(I.atrasoMedio)],
    ["Em trânsito",I.transito.length],["Em trânsito com previsão dentro da necessidade (%)",pct(I.transitoOk)],["Desvio médio previsto em trânsito (h)",hrs(I.desvioPrev)],["Aguardando carregamento no porto",I.porto.length],
    ["Tempo médio de viagem (h)",hrs(I.lead)],["Erro médio da 1ª previsão (h)",hrs(I.erroPrimeira)],["Erro médio da última previsão (h)",hrs(I.erroUltima)],
    ["Follows com horário programado divergente (%)",pct(I.divergencia)],["Follows enviados hoje",I.env.feitos],["Horas com follow hoje (%)",pct(I.env.aderencia)],["Maior intervalo sem follow hoje (h)",hrs(I.env.maiorGap)]
  ].map(([a,b])=>({"Indicador":a,"Valor":b}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(indRows),"Indicadores");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(I.grupos.map(g=>({"Grupo":g.nome,"Containers":g.n,"Com veículo":g.comVeic,"Entregues":g.ent,"No prazo":g.ok,"OTD (%)":pct(g.otd),"Atraso médio entregas (h)":hrs(g.atraso),"Em trânsito":g.trans,"Desvio previsto médio (h)":hrs(g.prev)}))),"Indicadores por grupo");
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const dl=await window.claude?.use?.("downloads");
  if(!dl){ toast("Download indisponível nesta visualização"); return; }
  try{ await dl.save({filename:`Iveco_Necessidade_x_Follow_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`, data:new Uint8Array(buf)}); }
  catch(e){ if(e.code!=="declined") toast("Não foi possível exportar ("+e.code+")"); }
}

/* ---------- eventos ---------- */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab; document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
  ["bi","anim","crit","comp","tl","fora","prog","rod","ind"].forEach(k=>$("#v-"+k).hidden = k!==state.tab);
  $("#f-sit").hidden = !(state.tab==="comp"||state.tab==="tl");
  $("#w-socrit").hidden = !(state.tab==="comp"||state.tab==="tl"||state.tab==="prog");
  document.querySelector(".legend").hidden = state.tab!=="tl";
  document.querySelector(".toolbar").hidden = state.tab==="ind"||state.tab==="rod"||state.tab==="bi"||state.tab==="anim";
  document.body.classList.toggle("bi-mode", state.tab==="bi");
  try{ localStorage.setItem("iveco.tab",state.tab);}catch(e){}
  render();
});
$("#q").oninput=e=>{ state.q=e.target.value; render(); };
$("#f-dia").onchange=e=>{ state.dia=e.target.value; render(); };
$("#f-sit").onchange=e=>{ state.sit=e.target.value; render(); };
$("#f-socrit").onchange=e=>{ state.soCrit=e.target.checked; render(); };
$("#b-import").onclick=painelImport;
$("#b-new").onclick=()=>painelEdit(null);
$("#b-resumo").onclick=painelResumo;
$("#b-export").onclick=exportar;
document.addEventListener("click",e=>{ const tr=e.target.closest("tbody tr[data-cn]"); if(tr) painelEdit(tr.dataset.cn); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const tr=e.target.closest&&e.target.closest("tbody tr[data-cn]"); if(tr) painelEdit(tr.dataset.cn); } });
window.addEventListener("resize",()=>{ if(state.tab==="tl") renderTl(filtra(linhasComp(),()=>"")); });
setInterval(render, 60000);

/* ---------- conexão ---------- */
function setConn(on,t){ $("#conn-dot").className="dot "+(on?"on":"off"); $("#conn-txt").textContent=t; }
render();
(async()=>{
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!db){ setConn(false,"Base indisponível nesta visualização"); return; }
  state.db=db; setConn(true,(window.__modoNuvem&&window.__modoNuvem().nuvem)?"Conectando à nuvem…":"Salvo neste aparelho");
  const sub=(col,key)=>db.collection(col).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x) m[d.id]=x; }); state[key]=m; render(); }, e=>setConn(false,"Conexão perdida ("+e.code+") · recarregue"));
  sub("prog","prog"); sub("follow","follow"); sub("envios","envios"); sub("alertas","alertas");
  let varreu=false;
  db.collection("cidades").onSnapshot(s=>{ s.docs.forEach(d=>{ const c=d.data(); if(c) registraCidade(c); }); render();
    if(!varreu){ varreu=true; setTimeout(()=>autoCidades(Object.values(state.follow)).then(r=>{ if(r.novas.length){ toast(`Cidades adicionadas à rota: ${r.novas.map(c=>c.nome).join(", ")}`); render(); } }),1500); } }, ()=>{});
  db.doc("meta/rodovias").onSnapshot(s=>{ state.rodMeta=s.exists?s.data():{}; render(); }, ()=>{});
  db.doc("meta/info").onSnapshot(s=>{ state.meta=s.exists? s.data() : {}; render(); }, ()=>{});
})();
try{ const bb=JSON.parse(localStorage.getItem("iveco.bi")||"null"); if(bb) state.bi=Object.assign(state.bi,bb);
  const b=state.bi; b.cn=Array.isArray(b.cn)?b.cn:[]; b.crit=Array.isArray(b.crit)?b.crit:(b.crit==="criticos"?["__crit__"]:A(b.crit)); b.dia=A(b.dia);
  b.carga=Array.isArray(b.carga)?b.carga.filter(v=>v!=="betim"):(b.carga==="ativos"?["transito","porto","descarga","semveic"]:A(b.carga).filter(v=>v!=="betim")); b.sit=A(b.sit); b.dest=A(b.dest).filter(v=>v==="Sete Lagoas"||v==="Betim"); }catch(e){}
document.body.classList.toggle("bi-mode", state.tab==="bi");
try{ const pp=localStorage.getItem("iveco.periodo"); if(pp&&PERIODOS[pp]) state.periodo=pp; }catch(e){}
try{ const t=localStorage.getItem("iveco.tab"); if(t){ const b=document.querySelector(`.tab[data-tab="${t}"]`); b&&b.click(); } }catch(e){}
})();

</script>

<script>
// Aplicativo: instalação, funcionamento offline e backup dos dados
(function(){
  if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  const bar=document.getElementById("app-bar"), inst=document.getElementById("app-inst"), txt=document.getElementById("app-txt"); let ev=null;
  const instalado=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; let fora=false; try{ fora=localStorage.getItem("iveco.app-x")==="1"; }catch(e){}
  addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; if(!instalado&&!fora) bar.hidden=false; });
  inst.onclick=()=>{ if(ev){ ev.prompt(); ev.userChoice.finally(()=>{ ev=null; bar.hidden=true; }); } };
  document.getElementById("app-x").onclick=()=>{ bar.hidden=true; try{ localStorage.setItem("iveco.app-x","1"); }catch(e){} };
  addEventListener("appinstalled",()=>bar.hidden=true);
  if(!instalado&&!fora&&/iPhone|iPad|iPod/i.test(navigator.userAgent)){ txt.textContent="Para instalar no iPhone: toque em Compartilhar e depois em “Adicionar à Tela de Início”."; inst.hidden=true; bar.hidden=false; }
  const conn=document.getElementById("conn-txt"); const net=()=>{ let t=document.getElementById("off-tag"); if(!navigator.onLine){ if(!t&&conn){ t=document.createElement("span"); t.id="off-tag"; t.className="off-tag"; t.textContent="Sem internet"; conn.parentNode.appendChild(t); } } else if(t) t.remove(); };
  addEventListener("online",net); addEventListener("offline",net); net();
  // Backup
  const b=document.getElementById("b-backup"); if(b) b.onclick=()=>{
    const ov=document.createElement("div"); ov.className="bk-ov"; ov.innerHTML=`<div class="bk-box"><h3>Backup dos dados</h3>
      <p style="margin:0">Os dados (programação, follow, alertas, cidades) ficam guardados <b>neste aparelho</b>. Salve um backup para passar para outro computador ou celular, ou para não perder nada.</p>
      <button type="button" class="pri" id="bk-save">Salvar backup (.json)</button>
      <label class="bt" id="bk-rest">Restaurar backup de um arquivo<input type="file" id="bk-file" accept=".json,application/json" hidden></label>
      <div class="bk-msg" id="bk-msg"></div><button type="button" id="bk-close">Fechar</button></div>`;
    document.body.appendChild(ov); const msg=ov.querySelector("#bk-msg"); const md=window.__modoNuvem&&window.__modoNuvem(); if(md&&md.nuvem&&!md.editor) ov.querySelector("#bk-rest").hidden=true; if(md&&md.nuvem) ov.querySelector("p").innerHTML="Os dados ficam na <b>nuvem</b> e aparecem para todos os usuários. Use o backup para guardar uma cópia de segurança"+(md.editor?" ou para carregar os dados pela primeira vez (Restaurar).":"."); ov.onclick=e=>{ if(e.target===ov) ov.remove(); }; ov.querySelector("#bk-close").onclick=()=>ov.remove();
    ov.querySelector("#bk-save").onclick=async()=>{ const j=await window.__backupDados(); const d=new Date(), p=n=>String(n).padStart(2,"0"); const nome=`backup-controle-iveco-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
      const dl=await window.claude.use("downloads"); try{ await dl.save({filename:nome,data:JSON.stringify(j),mimeType:"application/json"}); msg.textContent="Backup salvo: "+nome+" ("+Object.keys(j.dados).length+" registros)."; }catch(e){ msg.textContent="Backup cancelado."; } };
    ov.querySelector("#bk-file").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; if(!confirm((window.__modoNuvem&&window.__modoNuvem().nuvem)?"Restaurar este backup vai SUBSTITUIR os dados da NUVEM para todos os usuários. Continuar?":"Restaurar este backup vai SUBSTITUIR os dados atuais deste aparelho. Continuar?")) return;
      try{ const j=JSON.parse(await f.text()); await window.__restaurarDados(j); msg.textContent="Backup restaurado. Recarregando…"; setTimeout(()=>location.reload(),800); }catch(err){ msg.textContent="Não foi possível restaurar: "+err.message; } };
  };
})();
</script>
